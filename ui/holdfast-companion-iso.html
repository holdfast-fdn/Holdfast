<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Holdfast — Companion (Isometric)</title>
<style>
  :root{
    --bone:#F2ECDE; --steel:#9aa7b4; --ember:#E8622C; --gold:#E0A848;
    --you:#E8622C; --pact:#5B8DB8; --horde:#C0413B;
    --sans:'Helvetica Neue',Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--bone);background:#06121c;overflow:hidden}
  .stage{position:relative;width:100%;height:100vh;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas.drag{cursor:grabbing}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(72% 66% at 50% 44%, transparent 46%, rgba(4,10,18,.45) 82%, rgba(3,8,14,.8) 100%)}

  .crest{position:absolute;top:20px;left:22px;display:flex;align-items:center;gap:13px;z-index:5}
  .crest svg{width:46px;height:46px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
  .crest .nm{font-weight:800;font-size:21px;letter-spacing:-.4px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  .crest .sb{font-size:9.5px;letter-spacing:3.5px;color:var(--gold);margin-top:4px}
  .resbar{position:absolute;top:20px;right:22px;display:flex;gap:8px;z-index:5}
  .res{display:flex;align-items:center;gap:9px;padding:9px 15px;
    background:linear-gradient(180deg,rgba(20,30,42,.9),rgba(10,18,28,.9));backdrop-filter:blur(8px);
    border:1px solid #314150;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .res .ic{font-size:16px}.res .k{font-size:8.5px;letter-spacing:1.5px;color:var(--steel);text-transform:uppercase}
  .res .v{font-family:var(--mono);font-size:17px;font-weight:700}.res .v.flux{color:var(--ember)}.res .v.gold{color:var(--gold)}
  .clock .dot{width:6px;height:6px;border-radius:50%;background:var(--ember);display:inline-block;margin-right:6px;animation:pl 2.2s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(232,98,44,.5)}70%{box-shadow:0 0 0 6px rgba(232,98,44,0)}100%{box-shadow:0 0 0 0 rgba(232,98,44,0)}}
  .panel{position:absolute;background:linear-gradient(180deg,rgba(18,27,38,.93),rgba(9,16,25,.95));
    backdrop-filter:blur(10px);border:1px solid #314150;z-index:5;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
  .ph{font-size:9.5px;letter-spacing:2.5px;color:var(--steel);text-transform:uppercase;padding:13px 16px 0;display:flex;justify-content:space-between}
  .stand{bottom:54px;left:22px;width:284px;padding-bottom:14px}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 16px 0}
  .fdot{width:9px;height:9px;border-radius:2px;flex:0 0 9px;box-shadow:0 0 8px currentColor}
  .fname{font-size:13px;font-weight:600;flex:1}.fname.you{color:var(--ember)}
  .fbar{flex:1.3;height:7px;background:#0a121b;overflow:hidden;max-width:90px;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .fbar span{display:block;height:100%;box-shadow:0 0 8px currentColor}
  .fnum{font-family:var(--mono);font-size:11px;color:var(--steel);min-width:30px;text-align:right}.fnum b{color:var(--bone)}
  .cmd{top:50%;right:22px;transform:translateY(-50%);width:298px;z-index:6}
  .cbanner{padding:15px 17px;border-bottom:1px solid #314150;position:relative;overflow:hidden}
  .cbanner .ct{font-size:20px;font-weight:800;position:relative}.cbanner .co{font-size:11px;font-weight:600;margin-top:3px;position:relative}
  .ctag{position:absolute;top:15px;right:17px;font-family:var(--mono);font-size:10px;padding:4px 9px;background:rgba(0,0,0,.4);border:1px solid #314150;letter-spacing:1px;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
  .cbody{padding:15px 17px 17px}
  .sbar{margin-bottom:13px}.sbar .sl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
  .sbar .sl .l{color:var(--steel);letter-spacing:.5px}.sbar .sl .n{font-family:var(--mono);color:var(--bone);font-weight:600}
  .track{height:7px;background:#0a121b;overflow:hidden;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .track span{display:block;height:100%}
  .meta2{display:flex;justify-content:space-between;font-size:11.5px;padding:9px 0;border-top:1px solid #1c2a38}
  .meta2 .l{color:var(--steel)}.meta2 .v{font-family:var(--mono);color:var(--bone)}
  .lastev{font-size:12px;line-height:1.5;color:#cdd6df;margin-top:6px}
  .threat{margin-top:12px;padding:10px 12px;font-size:12px;line-height:1.5;background:rgba(0,0,0,.32);border-left:3px solid var(--steel);color:#d2dae2;clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 calc(100% - 6px))}
  .threat.hi{border-color:var(--horde)}.threat.mid{border-color:var(--gold)}.threat.lo{border-color:var(--pact)}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:13px;font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;background:linear-gradient(180deg,#f0703a,#d8531f);color:#fff;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:0 6px 18px rgba(232,98,44,.35)}
  .cta:hover{filter:brightness(1.08)}.cta.def{background:linear-gradient(180deg,#6ea0c8,#4a7da8);box-shadow:0 6px 18px rgba(91,141,184,.3)}
  .ticker{position:absolute;bottom:0;left:0;right:0;height:38px;z-index:5;background:linear-gradient(180deg,rgba(6,14,22,.55),rgba(6,14,22,.95));border-top:1px solid #1a2836;display:flex;align-items:center;overflow:hidden}
  .ticker .tag{flex:0 0 auto;font-size:9px;letter-spacing:2px;color:var(--gold);padding:0 14px;border-right:1px solid #1a2836;height:100%;display:flex;align-items:center;background:rgba(0,0,0,.3)}
  .tkscroll{display:flex;gap:42px;white-space:nowrap;animation:scroll 38s linear infinite;padding-left:42px}
  .tkscroll:hover{animation-play-state:paused}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .tkitem{font-size:12.5px;color:#c2cad3}.tkitem b{color:var(--bone)}.tkitem .e{color:var(--ember)}.tkitem .h{color:var(--horde)}.tkitem .p{color:var(--pact)}
  .tkitem .tk{font-family:var(--mono);font-size:10px;color:var(--steel);margin-right:7px}
  .hint{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--steel);z-index:4;background:rgba(6,14,22,.6);padding:6px 14px;border-radius:20px;border:1px solid #1a2836}
  @media(max-width:760px){.stand{display:none}.cmd{width:250px;right:10px}.resbar{flex-direction:column}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="vig"></div>

  <div class="crest">
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="8" width="224" height="224" rx="48" fill="#11161D" stroke="#314150" stroke-width="3"/>
      <path d="M62 78 L82 58 L98 58 L98 184 L62 184 Z" fill="#ECE6D8"/>
      <path d="M142 58 L158 58 L178 78 L178 184 L142 184 Z" fill="#ECE6D8"/>
      <rect x="98" y="104" width="44" height="34" fill="#ECE6D8"/>
      <path d="M107 138 L107 120 Q107 109 120 109 Q133 109 133 120 L133 138 Z" fill="#E8622C"/>
    </svg>
    <div><div class="nm">HOLDFAST</div><div class="sb">THE SUNDERED ISLES</div></div>
  </div>
  <div class="resbar">
    <div class="res"><span class="ic">🪙</span><div><div class="k">Flux</div><div class="v flux">340</div></div></div>
    <div class="res"><span class="ic">🏴</span><div><div class="k">Isles</div><div class="v gold">2</div></div></div>
    <div class="res clock"><div><div class="k"><span class="dot"></span>Tick 24 closes</div><div class="v" id="timer">11:58:04</div></div></div>
  </div>
  <div class="panel stand"><div class="ph"><span>Dominion</span><span>9 ISLES</span></div><div id="stand"></div></div>
  <div class="panel cmd" id="cmd"></div>
  <div class="hint">drag to pan · scroll to zoom · click an isle</div>
  <div class="ticker"><div class="tag">WAR LOG</div><div class="tkscroll" id="tk"></div></div>
</div>

<script>
/* ============================================================================
   HOLDFAST · Companion isometric map (read-only)
   Pure Canvas 2D. No dependencies. Runs immediately with procedural tiles.

   TO USE REAL KENNEY ART (CC0):
   1. Download an isometric pack (e.g. kenney.nl/assets/isometric-landscape).
   2. Drop PNGs into ./assets/kenney/ next to this file.
   3. Fill ASSETS paths below and set USE_SPRITES = true.
   The renderer will blit sprites instead of drawing procedural placeholders.

   PORTING TO PIXIJS later: the projection (isoToScreen), the WORLD state, and
   the draw order are engine-agnostic. Swap the ctx.* draw calls for PIXI
   Sprites/Graphics in the same back-to-front order. Nothing else changes.

   READ-ONLY: this map only DRAWS state. Truth lives in the resolver + Base.
   In production, WORLD is fed by the indexer, not hard-coded here.
============================================================================ */

const USE_SPRITES = false;            // flip to true once Kenney PNGs are in place
const ASSETS = {                      // tileType -> sprite path (Kenney isometric)
  sea:        'assets/kenney/landscapeTiles_water.png',
  you:        'assets/kenney/landscapeTiles_grassEmber.png',
  'Iron Pact':'assets/kenney/landscapeTiles_grassBlue.png',
  'Ashen Horde':'assets/kenney/landscapeTiles_grassRed.png',
  Unclaimed:  'assets/kenney/landscapeTiles_grassWild.png',
  keep:       'assets/kenney/buildingTiles_keep.png',
  tower:      'assets/kenney/buildingTiles_tower.png',
  trees:      'assets/kenney/natureTiles_trees.png',
};

// ---- isometric constants ----
const TW=128, TH=64;     // tile diamond width/height (2:1 iso)
const THICK=18;          // slab thickness (the "cliff" sides)
const ELEV=20;           // territory raised above the sea

const FCOL={you:'#E8622C','Iron Pact':'#5B8DB8','Ashen Horde':'#C0413B',Unclaimed:'#86946d'};
const FTOP={you:'#cf7a3c','Iron Pact':'#5f93c2','Ashen Horde':'#cc5650',Unclaimed:'#84955f'};
const FSIDE={you:'#7a3e1d','Iron Pact':'#2f4f6c','Ashen Horde':'#6a2723',Unclaimed:'#46512f'};
const SEA_TOP='#1a6580', SEA_SIDE='#0d3a4e';

// ---- WORLD state (read-only; in production this comes from the indexer) ----
// 5x5 board: outer ring = sea, inner 3x3 = territory isles.
const META=[ // inner 3x3 territory metadata, row-major (col 1..3, row 1..3)
  {id:'01',owner:'you',gar:120,since:19,last:'You took it from Iron Pact'},
  {id:'03',owner:'Unclaimed',gar:60,since:null,last:'Open ground — never claimed'},
  {id:'06',owner:'Ashen Horde',gar:140,since:20,last:'Three assaults repelled'},
  {id:'02',owner:'you',gar:95,since:12,last:'Held against an Ashen assault'},
  {id:'05',owner:'Unclaimed',gar:65,since:null,last:'Contested twice, never taken'},
  {id:'08',owner:'Ashen Horde',gar:100,since:17,last:'Ashen Horde captured it'},
  {id:'04',owner:'Iron Pact',gar:110,since:15,last:'Iron Pact reinforced, +30'},
  {id:'09',owner:'Iron Pact',gar:80,since:14,last:'Light Iron Pact outpost'},
  {id:'07',owner:'Unclaimed',gar:55,since:null,last:'Open ground, eastern edge'},
];
const GRID=5;
const tiles=[];
let mi=0;
for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
  const inner=(c>=1&&c<=3&&r>=1&&r<=3);
  if(inner){const m=META[mi++];tiles.push({c,r,type:'land',...m});}
  else tiles.push({c,r,type:'sea'});
}
// draw order: back-to-front by (c+r)
tiles.sort((a,b)=>(a.c+a.r)-(b.c+b.r));

// ---- camera ----
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cam={x:0,y:0,scale:1}, DPR=Math.min(2,window.devicePixelRatio||1);
let selected=tiles.findIndex(t=>t.id==='06');

function resize(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

function isoToScreen(c,r){return {x:(c-r)*TW/2, y:(c+r)*TH/2};}
// world center for initial camera
(function center(){let sx=0,sy=0,n=0;tiles.forEach(t=>{const p=isoToScreen(t.c,t.r);sx+=p.x;sy+=p.y;n++;});
  cam.x=innerWidth/2 - sx/n; cam.y=innerHeight/2 - sy/n + 10;})();

// ---- sprite loading (optional) ----
const IMG={}; let spritesReady=!USE_SPRITES;
if(USE_SPRITES){let pending=Object.keys(ASSETS).length;
  for(const k in ASSETS){const im=new Image();im.onload=im.onerror=()=>{if(--pending<=0)spritesReady=true;};im.src=ASSETS[k];IMG[k]=im;}}

// ---- drawing ----
function diamond(cx,cy){ctx.beginPath();ctx.moveTo(cx,cy-TH/2);ctx.lineTo(cx+TW/2,cy);ctx.lineTo(cx,cy+TH/2);ctx.lineTo(cx-TW/2,cy);ctx.closePath();}
function drawTile(t){
  const p=isoToScreen(t.c,t.r);
  const sx=cam.x+p.x*cam.scale, baseY=cam.y+p.y*cam.scale;
  const elev=(t.type==='land'?ELEV:0)*cam.scale, th=(t.type==='land'?THICK:8)*cam.scale;
  const topY=baseY-elev;
  ctx.save();ctx.scale(1,1);
  const sc=cam.scale;
  // store hit info for land
  t._hit={x:sx,y:topY};
  const top = t.type==='sea'?SEA_TOP:FTOP[t.owner];
  const side= t.type==='sea'?SEA_SIDE:FSIDE[t.owner];
  // --- slab sides (cliff) ---
  ctx.beginPath();
  ctx.moveTo(sx-TW/2*sc, topY); ctx.lineTo(sx, topY+TH/2*sc);
  ctx.lineTo(sx, topY+TH/2*sc+th); ctx.lineTo(sx-TW/2*sc, topY+th); ctx.closePath();
  ctx.fillStyle=side; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx, topY+TH/2*sc); ctx.lineTo(sx+TW/2*sc, topY);
  ctx.lineTo(sx+TW/2*sc, topY+th); ctx.lineTo(sx, topY+TH/2*sc+th); ctx.closePath();
  ctx.fillStyle=shade(side,-12); ctx.fill();
  // --- top face ---
  ctx.save();ctx.translate(sx,topY);ctx.scale(sc,sc);
  diamond(0,0); ctx.fillStyle=top; ctx.fill();
  // subtle top light
  diamond(0,0); ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fill();
  ctx.restore();

  if(USE_SPRITES && spritesReady){
    // OPTIONAL: blit Kenney sprite centered on the top face
    const key = t.type==='sea'?'sea':t.owner;
    const im=IMG[key];
    if(im&&im.complete&&im.naturalWidth){
      const w=TW*sc, h=im.naturalHeight/im.naturalWidth*w;
      ctx.drawImage(im, sx-w/2, topY-h+TH/2*sc, w, h);
    }
  } else if(t.type==='land'){
    // procedural decorations (placeholder until sprites are dropped in)
    decorate(t,sx,topY,sc);
  }
  ctx.restore();
}

function decorate(t,sx,topY,sc){
  ctx.save();ctx.translate(sx,topY);ctx.scale(sc,sc);
  const col=FCOL[t.owner];
  // selection ring (animated pulse)
  if(tiles[selected]===t){const k=0.5+0.5*Math.sin(Date.now()/300);
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,'+(0.5+k*0.5)+')';diamond(0,0);ctx.stroke();}
  // structure
  if(t.gar>=120){ // keep (fortress) — bastion motif
    ctx.fillStyle='#8a8273';ctx.strokeStyle='#5d5648';ctx.lineWidth=1;
    ctx.beginPath();ctx.rect(-16,-30,12,30);ctx.rect(4,-30,12,30);ctx.fill();ctx.stroke();
    ctx.fillStyle='#9a9283';ctx.fillRect(-6,-24,12,24);
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-2,-24);ctx.lineTo(-2,-30);ctx.lineTo(8,-30);ctx.lineTo(8,-24);ctx.closePath();ctx.fill();
  } else if(t.owner==='Unclaimed'){ // trees
    ctx.fillStyle='#3f7a43';tri(-12,-2,9);tri(2,-4,11);ctx.fillStyle='#4c8c50';tri(10,0,9);
  } else { // tower
    ctx.fillStyle='#8a8273';ctx.strokeStyle='#5d5648';ctx.lineWidth=1;ctx.beginPath();ctx.rect(-6,-26,12,26);ctx.fill();ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-7,-26);ctx.lineTo(0,-33);ctx.lineTo(7,-26);ctx.closePath();ctx.fill();
  }
  // banner pole for owned
  if(t.owner!=='Unclaimed'){ctx.strokeStyle='#cfc7b6';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(20,-30);ctx.lineTo(20,-8);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(20,-30);ctx.lineTo(34,-26);ctx.lineTo(20,-22);ctx.closePath();ctx.fill();}
  // garrison badge
  ctx.fillStyle='rgba(8,16,24,.85)';ctx.strokeStyle=col;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-16,4);ctx.lineTo(16,4);ctx.lineTo(16,15);ctx.lineTo(0,21);ctx.lineTo(-16,15);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 13px '+getMono();ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(t.gar,0,11);
  // label
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='bold 9px sans-serif';
  ctx.fillText(t.owner==='you'?'YOURS':t.owner==='Unclaimed'?'ISLE '+t.id:t.owner.toUpperCase(),0,34);
  ctx.restore();
}
function tri(x,y,h){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-h*0.5,y+h);ctx.lineTo(x+h*0.5,y+h);ctx.closePath();ctx.fill();}
function getMono(){return "ui-monospace,Menlo,monospace";}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  tiles.forEach(drawTile);
  requestAnimationFrame(draw);
}

// ---- interaction ----
let dragging=false,last={x:0,y:0},moved=0;
cv.addEventListener('pointerdown',e=>{dragging=true;moved=0;last={x:e.clientX,y:e.clientY};cv.classList.add('drag');});
addEventListener('pointerup',e=>{if(dragging&&moved<5)pick(e.clientX,e.clientY);dragging=false;cv.classList.remove('drag');});
addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);cam.x+=dx;cam.y+=dy;last={x:e.clientX,y:e.clientY};});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:0.9;
  const ns=Math.max(0.5,Math.min(2.2,cam.scale*f));
  // zoom toward cursor
  cam.x=e.clientX-(e.clientX-cam.x)*(ns/cam.scale);cam.y=e.clientY-(e.clientY-cam.y)*(ns/cam.scale);cam.scale=ns;},{passive:false});

function pick(mx,my){
  // front-to-back: iterate reverse draw order, hit-test top diamond
  for(let i=tiles.length-1;i>=0;i--){const t=tiles[i];if(t.type!=='land'||!t._hit)continue;
    const dx=Math.abs(mx-t._hit.x),dy=Math.abs(my-t._hit.y);
    if(dx/(TW/2*cam.scale)+dy/(TH/2*cam.scale)<=1){selected=i;select(t);return;}}
}

// ---- HUD panels ----
function renderStand(){
  const counts={},str={};tiles.forEach(t=>{if(t.type!=='land')return;counts[t.owner]=(counts[t.owner]||0)+1;str[t.owner]=(str[t.owner]||0)+t.gar;});
  const order=['you','Ashen Horde','Iron Pact','Unclaimed'];const box=document.getElementById('stand');box.innerHTML='';
  order.forEach(f=>{const c=counts[f]||0,pct=Math.round(c/9*100);const d=document.createElement('div');d.className='frow';
    d.innerHTML='<span class="fdot" style="background:'+FCOL[f]+';color:'+FCOL[f]+'"></span><span class="fname '+(f==='you'?'you':'')+'">'+(f==='you'?'You':f)+'</span><span class="fbar"><span style="width:'+pct+'%;background:'+FCOL[f]+';color:'+FCOL[f]+'"></span></span><span class="fnum"><b>'+c+'</b>/9</span>';
    box.appendChild(d);});}
function fortLabel(g){return g>=120?'FORTRESS':g>=90?'FORTIFIED':'OUTPOST';}
function select(t){const col=FCOL[t.owner];const def=(Math.pow(t.gar,0.5)*1.3).toFixed(1);
  const garPct=Math.min(100,t.gar/180*100),defPct=Math.min(100,def/20*100);let threat,tcls;
  if(t.owner==='you'){threat='Yours. Earns +12 Flux each tick. Garrison hardens slowly while unchallenged.';tcls='lo';}
  else if(t.gar>=120){threat='High threat. Every repelled assault has thickened these walls. Breaking it needs a heavy commitment.';tcls='hi';}
  else if(t.owner==='Unclaimed'){threat='Open ground. Lightly held and unclaimed — your cheapest path to expand.';tcls='mid';}
  else{threat='Moderate threat. Worth taking if you commit enough Flux to swing past the defender advantage.';tcls='mid';}
  document.getElementById('cmd').innerHTML=
    '<div class="cbanner"><div style="position:absolute;inset:0;background:'+col+';opacity:.14"></div><div class="ct">Isle '+t.id+'</div><div class="co" style="color:'+col+'">'+(t.owner==='you'?'Held by you':t.owner)+'</div><div class="ctag">'+fortLabel(t.gar)+'</div></div>'+
    '<div class="cbody"><div class="sbar"><div class="sl"><span class="l">GARRISON</span><span class="n">'+t.gar+'</span></div><div class="track"><span style="width:'+garPct+'%;background:'+col+'"></span></div></div>'+
    '<div class="sbar"><div class="sl"><span class="l">DEFENSE RATING</span><span class="n">'+def+'</span></div><div class="track"><span style="width:'+defPct+'%;background:'+col+'"></span></div></div>'+
    '<div class="meta2"><span class="l">Held since</span><span class="v">'+(t.since?'Tick '+t.since:'—')+'</span></div><div class="lastev">⚑ '+t.last+'</div><div class="threat '+tcls+'">'+threat+'</div>'+
    (t.owner!=='you'?'<div class="cta">⚔ Issue orders · @HoldfastGM</div>':'<div class="cta def">🛡 Reinforce · @HoldfastGM</div>')+'</div>';}

const logs=[
  {tk:'T24',tx:'Dawn breaks. The <span class="h">Ashen Horde</span> stirs in the east.'},
  {tk:'T23',tx:'<span class="h">Ashen Horde</span> seized <b>Isle 07</b> and presses your waters.'},
  {tk:'T23',tx:'<span class="p">Iron Pact</span> reinforced <b>Isle 04</b> — garrison now 110.'},
  {tk:'T22',tx:'<span class="e">You</span> held <b>Isle 02</b> against an Ashen landing (61% — won).'},
  {tk:'T21',tx:'<b>Isle 06</b> repelled its third assault. It is a fortress now.'},
  {tk:'T19',tx:'<span class="e">You</span> took <b>Isle 01</b> from <span class="p">Iron Pact</span>, +55 Flux spoils.'},
];
const tk=document.getElementById('tk');logs.concat(logs).forEach(l=>{const s=document.createElement('span');s.className='tkitem';s.innerHTML='<span class="tk">'+l.tk+'</span>'+l.tx;tk.appendChild(s);});

let secs=43084;setInterval(()=>{secs--;const h=String(Math.floor(secs/3600)).padStart(2,'0'),m=String(Math.floor(secs%3600/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s;},1000);

renderStand();select(tiles[selected]);draw();
</script>
</body>
</html>

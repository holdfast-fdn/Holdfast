<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Holdfast — Region Command</title>
<style>
  :root{
    --bone:#ECE6D8; --steel:#8A97A5; --ember:#E8622C; --gold:#E0A848;
    --you:#E8622C; --pact:#5B8DB8; --horde:#C0413B;
    --sans:'Helvetica Neue',Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--bone);background:#05080c;overflow:hidden}

  .stage{position:relative;width:100%;height:100vh;overflow:hidden;
    background:radial-gradient(120% 90% at 50% -20%, #243341 0%, #131c26 38%, #0a1017 70%, #05080c 100%);}
  .fog{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 50% at 50% 42%, transparent 40%, rgba(5,8,12,.55) 78%, rgba(5,8,12,.9) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(circle at 30% 20%, rgba(232,98,44,.06), transparent 35%),
               radial-gradient(circle at 75% 75%, rgba(91,141,184,.06), transparent 40%)}
  .mote{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(224,168,72,.5);
    pointer-events:none;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(20px);opacity:0}15%{opacity:.8}100%{transform:translateY(-220px);opacity:0}}

  .mapbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  svg.map{width:min(92vw,860px);height:auto;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))}
  .hex{cursor:pointer}
  .hex .top{transition:filter .15s}
  .hex:hover .top{filter:brightness(1.2)}
  .gtxt{font-family:var(--mono);font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:3px}
  .glabel{font-family:var(--sans);font-weight:700;font-size:8px;letter-spacing:1.5px;
    text-anchor:middle;pointer-events:none;fill:rgba(255,255,255,.65)}
  .ghost{opacity:.12}
  @keyframes ping{0%{opacity:.7;transform:scale(.9)}70%{opacity:0;transform:scale(1.25)}100%{opacity:0}}

  .crest{position:absolute;top:20px;left:22px;display:flex;align-items:center;gap:13px;z-index:5}
  .crest svg{width:46px;height:46px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  .crest .nm{font-weight:800;font-size:21px;letter-spacing:-.4px;line-height:1}
  .crest .sb{font-size:9.5px;letter-spacing:3.5px;color:var(--steel);margin-top:4px}

  .resbar{position:absolute;top:20px;right:22px;display:flex;gap:8px;z-index:5}
  .res{display:flex;align-items:center;gap:9px;padding:9px 15px;
    background:linear-gradient(180deg,rgba(28,38,49,.92),rgba(14,21,29,.92));
    backdrop-filter:blur(8px);border:1px solid #2c3a48;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .res .ic{font-size:16px;line-height:1}
  .res .k{font-size:8.5px;letter-spacing:1.5px;color:var(--steel);text-transform:uppercase}
  .res .v{font-family:var(--mono);font-size:17px;font-weight:700}
  .res .v.flux{color:var(--ember)} .res .v.gold{color:var(--gold)}
  .clock .v{color:var(--bone)}
  .clock .dot{width:6px;height:6px;border-radius:50%;background:var(--ember);display:inline-block;
    margin-right:6px;animation:pl 2.2s infinite;vertical-align:1px}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(232,98,44,.5)}70%{box-shadow:0 0 0 6px rgba(232,98,44,0)}100%{box-shadow:0 0 0 0 rgba(232,98,44,0)}}

  .panel{position:absolute;background:linear-gradient(180deg,rgba(22,30,40,.94),rgba(12,18,25,.94));
    backdrop-filter:blur(10px);border:1px solid #2c3a48;z-index:5;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
  .ph{font-size:9.5px;letter-spacing:2.5px;color:var(--steel);text-transform:uppercase;
    padding:13px 16px 0;display:flex;justify-content:space-between}
  .stand{bottom:54px;left:22px;width:288px;padding-bottom:14px}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 16px 0}
  .fdot{width:9px;height:9px;border-radius:2px;flex:0 0 9px;box-shadow:0 0 8px currentColor}
  .fname{font-size:13px;font-weight:600;flex:1}.fname.you{color:var(--ember)}
  .fbar{flex:1.3;height:7px;background:#0a0f15;overflow:hidden;max-width:90px;
    clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .fbar span{display:block;height:100%;box-shadow:0 0 8px currentColor}
  .fnum{font-family:var(--mono);font-size:11px;color:var(--steel);min-width:30px;text-align:right}
  .fnum b{color:var(--bone)}

  .cmd{top:50%;right:22px;transform:translateY(-50%);width:298px;z-index:6}
  .cbanner{padding:15px 17px;border-bottom:1px solid #2c3a48;position:relative;overflow:hidden}
  .cbanner .ct{font-size:20px;font-weight:800;position:relative}
  .cbanner .co{font-size:11px;font-weight:600;margin-top:3px;position:relative}
  .ctag{position:absolute;top:15px;right:17px;font-family:var(--mono);font-size:10px;
    padding:4px 9px;background:rgba(0,0,0,.35);border:1px solid #2c3a48;letter-spacing:1px;
    clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
  .cbody{padding:15px 17px 17px}
  .sbar{margin-bottom:13px}
  .sbar .sl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
  .sbar .sl .l{color:var(--steel);letter-spacing:.5px}
  .sbar .sl .n{font-family:var(--mono);color:var(--bone);font-weight:600}
  .track{height:7px;background:#0a0f15;overflow:hidden;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .track span{display:block;height:100%}
  .meta2{display:flex;justify-content:space-between;font-size:11.5px;padding:9px 0;border-top:1px solid #222d39}
  .meta2 .l{color:var(--steel)} .meta2 .v{font-family:var(--mono);color:var(--bone)}
  .lastev{font-size:12px;line-height:1.5;color:#c2cad3;margin-top:6px}
  .threat{margin-top:12px;padding:10px 12px;font-size:12px;line-height:1.5;background:rgba(0,0,0,.3);
    border-left:3px solid var(--steel);color:#c8d0d8;clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 calc(100% - 6px))}
  .threat.hi{border-color:var(--horde)} .threat.mid{border-color:var(--gold)} .threat.lo{border-color:var(--pact)}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:13px;
    font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;
    background:linear-gradient(180deg,#f0703a,#d8531f);color:#fff;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    box-shadow:0 6px 18px rgba(232,98,44,.35)}
  .cta:hover{filter:brightness(1.08)}
  .cta.def{background:linear-gradient(180deg,#6ea0c8,#4a7da8);box-shadow:0 6px 18px rgba(91,141,184,.3)}

  .ticker{position:absolute;bottom:0;left:0;right:0;height:38px;z-index:5;
    background:linear-gradient(180deg,rgba(10,15,21,.6),rgba(10,15,21,.95));
    border-top:1px solid #1c2630;display:flex;align-items:center;overflow:hidden}
  .ticker .tag{flex:0 0 auto;font-size:9px;letter-spacing:2px;color:var(--gold);
    padding:0 14px;border-right:1px solid #1c2630;height:100%;display:flex;align-items:center;background:rgba(0,0,0,.3)}
  .tkscroll{display:flex;gap:42px;white-space:nowrap;animation:scroll 38s linear infinite;padding-left:42px}
  .tkscroll:hover{animation-play-state:paused}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .tkitem{font-size:12.5px;color:#b9c1ca}
  .tkitem b{color:var(--bone)} .tkitem .e{color:var(--ember)} .tkitem .h{color:var(--horde)} .tkitem .p{color:var(--pact)}
  .tkitem .tk{font-family:var(--mono);font-size:10px;color:var(--steel);margin-right:7px}

  @media(max-width:760px){
    .stand{display:none} .cmd{width:255px;right:10px} .resbar{flex-direction:column}
    .crest .nm{font-size:17px}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="grain"></div>
  <div class="mapbox"><svg class="map" id="map" viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="fog"></div>

  <div class="crest">
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="8" width="224" height="224" rx="48" fill="#11161D" stroke="#2c3a48" stroke-width="3"/>
      <path d="M62 78 L82 58 L98 58 L98 184 L62 184 Z" fill="#ECE6D8"/>
      <path d="M142 58 L158 58 L178 78 L178 184 L142 184 Z" fill="#ECE6D8"/>
      <rect x="98" y="104" width="44" height="34" fill="#ECE6D8"/>
      <path d="M107 138 L107 120 Q107 109 120 109 Q133 109 133 120 L133 138 Z" fill="#E8622C"/>
    </svg>
    <div><div class="nm">HOLDFAST</div><div class="sb">VERDANT MARCHES</div></div>
  </div>

  <div class="resbar">
    <div class="res"><span class="ic">🪙</span><div><div class="k">Flux</div><div class="v flux">340</div></div></div>
    <div class="res"><span class="ic">🏴</span><div><div class="k">Tiles</div><div class="v gold">2</div></div></div>
    <div class="res clock"><div><div class="k"><span class="dot"></span>Tick 24 closes</div><div class="v" id="timer">11:58:04</div></div></div>
  </div>

  <div class="panel stand">
    <div class="ph"><span>Region Control</span><span>9 TILES</span></div>
    <div id="stand"></div>
  </div>

  <div class="panel cmd" id="cmd"></div>

  <div class="ticker"><div class="tag">WAR LOG</div><div class="tkscroll" id="tk"></div></div>
</div>

<script>
const FCOL={you:'#E8622C','Iron Pact':'#5B8DB8','Ashen Horde':'#C0413B',Unclaimed:'#7E8C6A'};
const FCEN={you:'#7a3a22','Iron Pact':'#2c4a64','Ashen Horde':'#5e2522',Unclaimed:'#3a4634'};
const FEDGE={you:'#3d1d11','Iron Pact':'#16283a','Ashen Horde':'#321311',Unclaimed:'#1f261b'};
const S=52, D=8;
const tiles=[
  {id:'01',owner:'you',gar:120,since:19,last:'You took it from Iron Pact'},
  {id:'02',owner:'you',gar:95,since:12,last:'Held against an Ashen assault'},
  {id:'03',owner:'Unclaimed',gar:60,since:null,last:'Open ground — never claimed'},
  {id:'04',owner:'Iron Pact',gar:110,since:15,last:'Iron Pact reinforced, +30'},
  {id:'05',owner:'Unclaimed',gar:65,since:null,last:'Contested twice, never taken'},
  {id:'06',owner:'Ashen Horde',gar:140,since:20,last:'Three assaults repelled'},
  {id:'07',owner:'Unclaimed',gar:55,since:null,last:'Open ground, eastern edge'},
  {id:'08',owner:'Ashen Horde',gar:100,since:17,last:'Ashen Horde captured it'},
  {id:'09',owner:'Iron Pact',gar:80,since:14,last:'Light Iron Pact outpost'},
];
const C=[
  {x:225,y:150},{x:320,y:150},{x:415,y:150},
  {x:272,y:232},{x:367,y:232},{x:462,y:232},
  {x:225,y:314},{x:320,y:314},{x:415,y:314},
];
const ghosts=[{x:130,y:150},{x:510,y:150},{x:177,y:232},{x:557,y:232},{x:130,y:314},{x:510,y:314},{x:320,y:68},{x:367,y:396}];
const NS='http://www.w3.org/2000/svg';
function pts(cx,cy,s,dy){dy=dy||0;let p=[];for(let i=0;i<6;i++){let a=Math.PI/180*(60*i-30);p.push((cx+s*Math.cos(a)).toFixed(1)+','+(cy+dy+s*Math.sin(a)).toFixed(1));}return p.join(' ');}
function fortLabel(g){return g>=120?'FORTRESS':g>=90?'FORTIFIED':'OUTPOST';}
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
let selected=5;

function renderMap(){
  const svg=document.getElementById('map');svg.innerHTML='';
  const defs=el('defs',{});
  ['you','Iron Pact','Ashen Horde','Unclaimed'].forEach(f=>{
    const id='g'+f.replace(/\s/g,'');
    const g=el('radialGradient',{id:id,cx:'50%',cy:'34%',r:'72%'});
    g.appendChild(el('stop',{offset:'0','stop-color':FCOL[f],'stop-opacity':'.55'}));
    g.appendChild(el('stop',{offset:'42%','stop-color':FCEN[f]}));
    g.appendChild(el('stop',{offset:'100%','stop-color':FEDGE[f]}));
    defs.appendChild(g);
  });
  svg.appendChild(defs);
  ghosts.forEach(c=>{svg.appendChild(el('polygon',{points:pts(c.x,c.y,S),fill:'none',stroke:'#3a4634','stroke-width':'2',class:'ghost'}));});
  tiles.forEach((t,i)=>{
    const c=C[i];const g=el('g',{class:'hex'});g.onclick=()=>select(i);
    g.appendChild(el('polygon',{points:pts(c.x,c.y,S,D),fill:FEDGE[t.owner]}));
    if(selected===i){const ping=el('polygon',{points:pts(c.x,c.y,S+5),fill:'none',stroke:'#fff','stroke-width':'2'});
      ping.style.transformOrigin=c.x+'px '+c.y+'px';ping.style.animation='ping 1.6s ease-out infinite';g.appendChild(ping);}
    g.appendChild(el('polygon',{points:pts(c.x,c.y,S),fill:'url(#g'+t.owner.replace(/\s/g,'')+')',stroke:selected===i?'#fff':FCOL[t.owner],'stroke-width':selected===i?'3.5':'2.5',class:'top'}));
    if(t.gar>=120){g.appendChild(el('path',{d:'M'+(c.x-16)+' '+(c.y-20)+' l5 -10 l5 7 l6 -10 l6 10 l5 -7 l5 10 Z',fill:FCOL[t.owner],opacity:'.9',stroke:'rgba(0,0,0,.4)','stroke-width':'1'}));}
    if(t.owner!=='Unclaimed'){
      g.appendChild(el('rect',{x:c.x-0.8,y:c.y-S+10,width:1.6,height:18,fill:'#cfc7b6'}));
      g.appendChild(el('path',{d:'M'+(c.x+0.8)+' '+(c.y-S+11)+' l16 4 l-16 4 Z',fill:FCOL[t.owner],stroke:'rgba(0,0,0,.3)','stroke-width':'.5'}));
    }
    const gt=el('text',{x:c.x,y:c.y+6,class:'gtxt','font-size':'22'});gt.textContent=t.gar;g.appendChild(gt);
    const lab=el('text',{x:c.x,y:c.y+24,class:'glabel'});
    lab.textContent=t.owner==='you'?'YOURS':t.owner==='Unclaimed'?'OPEN · '+t.id:t.owner.split(' ')[0].toUpperCase()+' · '+t.id;
    g.appendChild(lab);
    svg.appendChild(g);
  });
}

function renderStand(){
  const counts={},str={};tiles.forEach(t=>{counts[t.owner]=(counts[t.owner]||0)+1;str[t.owner]=(str[t.owner]||0)+t.gar;});
  const order=['you','Ashen Horde','Iron Pact','Unclaimed'];
  const box=document.getElementById('stand');box.innerHTML='';
  order.forEach(f=>{const c=counts[f]||0,pct=Math.round(c/9*100);
    const d=document.createElement('div');d.className='frow';
    d.innerHTML='<span class="fdot" style="background:'+FCOL[f]+';color:'+FCOL[f]+'"></span>'+
      '<span class="fname '+(f==='you'?'you':'')+'">'+(f==='you'?'You':f)+'</span>'+
      '<span class="fbar"><span style="width:'+pct+'%;background:'+FCOL[f]+';color:'+FCOL[f]+'"></span></span>'+
      '<span class="fnum"><b>'+c+'</b>/9</span>';
    box.appendChild(d);});
}

function select(i){selected=i;renderMap();
  const t=tiles[i];const col=FCOL[t.owner];
  const def=(Math.pow(t.gar,0.5)*1.3).toFixed(1);
  const garPct=Math.min(100,t.gar/180*100), defPct=Math.min(100,def/20*100);
  let threat,tcls;
  if(t.owner==='you'){threat='Yours. Earns +12 Flux each tick. Its garrison hardens slowly while unchallenged.';tcls='lo';}
  else if(t.gar>=120){threat='High threat. Every repelled assault has thickened these walls. Breaking it needs a heavy commitment — and the defender still holds the edge.';tcls='hi';}
  else if(t.owner==='Unclaimed'){threat='Open ground. Lightly held and unclaimed — your cheapest path to expand.';tcls='mid';}
  else{threat='Moderate threat. Worth taking if you commit enough Flux to swing past the defender advantage.';tcls='mid';}
  const cmd=document.getElementById('cmd');
  cmd.innerHTML=
    '<div class="cbanner"><div style="position:absolute;inset:0;background:'+col+';opacity:.14"></div>'+
      '<div class="ct">Tile '+t.id+'</div>'+
      '<div class="co" style="color:'+col+'">'+(t.owner==='you'?'Held by you':t.owner)+'</div>'+
      '<div class="ctag">'+fortLabel(t.gar)+'</div></div>'+
    '<div class="cbody">'+
      '<div class="sbar"><div class="sl"><span class="l">GARRISON</span><span class="n">'+t.gar+'</span></div>'+
        '<div class="track"><span style="width:'+garPct+'%;background:'+col+'"></span></div></div>'+
      '<div class="sbar"><div class="sl"><span class="l">DEFENSE RATING</span><span class="n">'+def+'</span></div>'+
        '<div class="track"><span style="width:'+defPct+'%;background:'+col+'"></span></div></div>'+
      '<div class="meta2"><span class="l">Controlled since</span><span class="v">'+(t.since?'Tick '+t.since:'—')+'</span></div>'+
      '<div class="lastev">⚑ '+t.last+'</div>'+
      '<div class="threat '+tcls+'">'+threat+'</div>'+
      (t.owner!=='you'
        ?'<div class="cta">⚔ Issue orders · @HoldfastGM</div>'
        :'<div class="cta def">🛡 Reinforce · @HoldfastGM</div>')+
    '</div>';
}

const logs=[
  {tk:'T24',tx:'Dawn breaks. The <span class="h">Ashen Horde</span> stirs in the east.'},
  {tk:'T23',tx:'<span class="h">Ashen Horde</span> seized <b>Tile 07</b> and now presses your border.'},
  {tk:'T23',tx:'<span class="p">Iron Pact</span> reinforced <b>Tile 04</b> — garrison now 110.'},
  {tk:'T22',tx:'<span class="e">You</span> held <b>Tile 02</b> against an Ashen assault (61% — won).'},
  {tk:'T21',tx:'<b>Tile 06</b> repelled its third assault. It is a fortress now.'},
  {tk:'T19',tx:'<span class="e">You</span> captured <b>Tile 01</b> from <span class="p">Iron Pact</span>, +55 Flux spoils.'},
];
const tk=document.getElementById('tk');
logs.concat(logs).forEach(l=>{const s=document.createElement('span');s.className='tkitem';
  s.innerHTML='<span class="tk">'+l.tk+'</span>'+l.tx;tk.appendChild(s);});

const stage=document.getElementById('stage');
for(let i=0;i<14;i++){const m=document.createElement('div');m.className='mote';
  m.style.left=(8+Math.random()*84)+'%';m.style.top=(40+Math.random()*45)+'%';
  m.style.animationDuration=(6+Math.random()*7)+'s';m.style.animationDelay=(Math.random()*7)+'s';
  m.style.opacity=Math.random()*.5+.2;stage.appendChild(m);}

let secs=43084;setInterval(()=>{secs--;const h=String(Math.floor(secs/3600)).padStart(2,'0');
  const m=String(Math.floor(secs%3600/60)).padStart(2,'0');const s=String(secs%60).padStart(2,'0');
  document.getElementById('timer').textContent=h+':'+m+':'+s;},1000);

renderMap();renderStand();select(5);
</script>
</body>
</html>

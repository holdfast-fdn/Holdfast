<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Holdfast — The World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nyx:#0B0E15; --basalt:#151B28; --marble:#F1EEE4; --steel:#97A1B5;
    --gold:#D9A845; --signal:#3FB8CE; --war:#E25D38; --laurel:#6FA876; --line:#232B3C;
    --sans:'Inter',system-ui,sans-serif; --display:'Cinzel',serif; --mono:ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--nyx);color:var(--marble);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .sky{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:radial-gradient(120% 90% at 50% -10%, #16203a 0%, #0d1322 44%, var(--nyx) 80%)}
  .cloud{position:absolute;border-radius:50%;filter:blur(64px);opacity:.14;
    background:radial-gradient(circle,#8aa6d8 0%,transparent 70%);animation:drift linear infinite}
  .c1{width:700px;height:340px;top:4%;left:-12%;animation-duration:100s}
  .c2{width:560px;height:300px;bottom:2%;right:-12%;opacity:.1;animation-duration:130s;animation-direction:reverse}
  @keyframes drift{0%{transform:translateX(-40px)}50%{transform:translateX(60px)}100%{transform:translateX(-40px)}}

  nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 28px}
  nav .brand{display:flex;align-items:center;gap:11px}
  nav .brand img{width:32px;height:32px;image-rendering:pixelated}
  nav .brand .nm{font-family:var(--display);font-weight:900;letter-spacing:3px;font-size:15px}
  nav .back{font-size:12.5px;color:var(--steel);letter-spacing:1px}
  nav .back:hover{color:var(--marble)}

  .head{position:relative;z-index:1;text-align:center;padding:48px 24px 14px}
  .eyebrow{color:var(--signal);font-size:11px;letter-spacing:5px;font-weight:600;text-transform:uppercase}
  .head h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,52px);letter-spacing:4px;margin:10px 0 8px}
  .head p{color:var(--steel);max-width:560px;margin:0 auto;font-size:15px}

  .regions{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:40px 28px 90px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  @media(max-width:880px){.regions{grid-template-columns:1fr;max-width:480px}}

  .region{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,rgba(21,27,40,.65),rgba(11,17,30,.8));
    transition:transform .22s,border-color .22s,box-shadow .22s;display:flex;flex-direction:column}
  .region:hover{transform:translateY(-6px);border-color:#3a4d6b;box-shadow:0 22px 50px rgba(0,0,0,.45)}
  .region.locked{opacity:.92}
  .rart{position:relative;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(80% 90% at 50% 20%, #2c5f93 0%, #1a4673 55%, #10314f 100%)}
  .rart img{width:74%;filter:drop-shadow(0 16px 26px rgba(0,8,20,.5));animation:bob 6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .rart .haze{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,17,30,.85))}
  .badge{position:absolute;top:12px;left:12px;z-index:2;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;
    padding:4px 10px;border-radius:20px;font-weight:700;text-transform:uppercase}
  .badge.live{background:rgba(111,168,118,.18);color:var(--laurel);box-shadow:inset 0 0 0 1px rgba(111,168,118,.5)}
  .badge.live::before{content:"●";margin-right:6px;animation:bl 1.8s infinite}
  @keyframes bl{50%{opacity:.3}}
  .badge.soon{background:rgba(151,161,181,.12);color:var(--steel);box-shadow:inset 0 0 0 1px rgba(151,161,181,.3)}
  .rbody{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column}
  .rbody .rn{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:1px}
  .rbody .rt{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-top:3px}
  .rbody .rd{font-size:13.5px;color:var(--steel);margin:12px 0 16px;flex:1;line-height:1.55}
  .rstat{display:flex;gap:16px;font-size:11px;color:var(--steel);margin-bottom:16px;font-family:var(--mono)}
  .rstat b{color:var(--marble)}
  .enter{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-weight:700;font-size:12px;
    letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .enter.go{background:linear-gradient(180deg,#E5B658,#C9941F);color:#11161F}
  .enter.go:hover{filter:brightness(1.07)}
  .enter.dim{background:rgba(255,255,255,.04);color:var(--steel);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
  footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:30px;text-align:center;color:var(--steel);font-size:12px}
  footer .base{color:var(--signal)}
</style>
</head>
<body>
<div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div></div>

<nav>
  <a class="brand" href="index.html"><img src="../brand/holdfast-logo.png" alt=""/><span class="nm">HOLDFAST</span></a>
  <a class="back" href="index.html">← Home</a>
</nav>

<div class="head">
  <div class="eyebrow">The World of Holdfast</div>
  <h1>CHOOSE YOUR CONTINENT</h1>
  <p>The continents are independent shards — each its own battlefield, settled on its own chain. Players are bound to one; the world is shared in story, not in war.</p>
</div>

<div class="regions" id="regions"></div>

<footer>HOLDFAST · built on <span class="base">Base</span> ⚓ · one continent is live; more are charted</footer>

<script>
// Region 0 is the deployed, on-chain continent. The rest are charted lore
// regions, explorable as preview maps (the isles map runs in demo mode).
const REGIONS=[
  {id:0,name:'The Sundered Isles',theme:'The First Continent',
   art:'assets/isl-6.png',
   desc:'Where the world began to break. Two AI powers — the Ashen Horde and the Iron Pact — contest nine isles against any who dare. Live on-chain.',
   live:true, isles:9, powers:2,
   href:'holdfast-isles.html?region=0&rpc=https%3A%2F%2Fsepolia.base.org&settlement=0x68C2Ef4544aA0071ebC98bD7bdAb958C11C3Af49'},
  {id:1,name:'The Ember Reach',theme:'Charted · Uncolonized',
   art:'assets/r1/isl-1.png',
   desc:'A volcanic archipelago wreathed in ash and gold. Its garrisons sleep, awaiting the first commanders. Explore the map; the war has not yet begun.',
   live:false, isles:9, powers:0,
   href:'holdfast-isles.html?region=1'},
  {id:2,name:'The Frostmark',theme:'Charted · Uncolonized',
   art:'assets/r2/isl-1.png',
   desc:'Wind-scoured isles at the edge of the map, held only by the wilds. A second shard, ready to be provisioned when the first world is proven.',
   live:false, isles:9, powers:0,
   href:'holdfast-isles.html?region=2'},
];
const box=document.getElementById('regions');
REGIONS.forEach(r=>{
  const a=document.createElement(r.live?'a':'a');
  a.className='region'+(r.live?'':' locked');
  a.href=r.href;
  a.innerHTML=
    '<div class="rart">'+
      '<span class="badge '+(r.live?'live':'soon')+'">'+(r.live?'Live · on-chain':'Charted')+'</span>'+
      '<img src="'+r.art+'" alt="" onerror="this.style.display=\'none\'"/>'+
      '<div class="haze"></div>'+
    '</div>'+
    '<div class="rbody">'+
      '<div class="rn">'+r.name+'</div><div class="rt">'+r.theme+'</div>'+
      '<div class="rd">'+r.desc+'</div>'+
      '<div class="rstat"><span>Isles <b>'+r.isles+'</b></span><span>Powers <b>'+r.powers+'</b></span></div>'+
      '<div class="enter '+(r.live?'go':'go')+'">'+(r.live?'⚔ Enter the war':'🧭 Explore the map')+'</div>'+
    '</div>';
  box.appendChild(a);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Holdfast — The Sundered Isles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#F1EEE4; --steel:#97A1B5; --ember:#D9A845; --gold:#D9A845;
    --signal:#3FB8CE; --you:#D9A845; --pact:#5B8DB8; --horde:#E25D38;
    --sans:'Inter','Helvetica Neue',Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --display:'Cinzel',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--bone);background:#1f74b8;overflow:hidden}
  .stage{position:relative;width:100%;height:100vh;overflow:hidden}
  svg.world{position:absolute;inset:0;width:100%;height:100%}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(75% 70% at 50% 44%, transparent 55%, rgba(8,30,55,.35) 86%, rgba(5,22,42,.6) 100%)}
  .island{cursor:pointer}
  .bob{animation:bob ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .island:hover .bob{filter:brightness(1.08)}
  .itxt{font-family:var(--mono);font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px}
  .ilabel{font-family:var(--sans);font-weight:800;font-size:11px;letter-spacing:1px;text-anchor:middle;pointer-events:none;fill:#fff;paint-order:stroke;stroke:rgba(8,40,70,.65);stroke-width:3px}
  @keyframes ping{0%{opacity:.85}70%{opacity:0}100%{opacity:0}}
  @keyframes drift{0%{transform:translateX(-60px)}100%{transform:translateX(120px)}}
  .cloud{animation:drift linear infinite;opacity:.5}
  @keyframes shimmer{0%,100%{opacity:.5}50%{opacity:.85}}
  .caustic{animation:shimmer ease-in-out infinite}
  @keyframes lavaglow{0%,100%{opacity:.75}50%{opacity:1}}
  .lava{animation:lavaglow 2.4s ease-in-out infinite}

  /* HUD */
  .crest{position:absolute;top:20px;left:22px;display:flex;align-items:center;gap:13px;z-index:5}
  .crest svg{width:46px;height:46px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
  .crest .nm{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:2px;line-height:1;text-shadow:0 2px 8px rgba(5,30,55,.8)}
  .crest .sb{font-size:9.5px;letter-spacing:3.5px;color:var(--gold);margin-top:4px;text-shadow:0 1px 4px rgba(5,30,55,.9)}
  .resbar{position:absolute;top:20px;right:22px;display:flex;gap:8px;z-index:5}
  .res{display:flex;align-items:center;gap:9px;padding:9px 15px;background:linear-gradient(180deg,rgba(16,24,38,.92),rgba(9,16,28,.94));backdrop-filter:blur(8px);border:1px solid #2c3c50;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .res .ic{font-size:16px}.res .k{font-size:8.5px;letter-spacing:1.5px;color:var(--steel);text-transform:uppercase}
  .res .v{font-family:var(--mono);font-size:17px;font-weight:700}.res .v.flux{color:var(--signal)}.res .v.gold{color:var(--gold)}
  .clock .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);display:inline-block;margin-right:6px;animation:pl 2.2s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(63,184,206,.5)}70%{box-shadow:0 0 0 6px rgba(63,184,206,0)}100%{box-shadow:0 0 0 0 rgba(63,184,206,0)}}
  .panel{position:absolute;background:linear-gradient(180deg,rgba(14,22,36,.94),rgba(8,14,26,.96));backdrop-filter:blur(10px);border:1px solid #2c3c50;z-index:5;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
  .ph{font-size:9.5px;letter-spacing:2.5px;color:var(--steel);text-transform:uppercase;padding:13px 16px 0;display:flex;justify-content:space-between}
  .stand{bottom:54px;left:22px;width:284px;padding-bottom:14px}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 16px 0}
  .fdot{width:9px;height:9px;border-radius:2px;flex:0 0 9px;box-shadow:0 0 8px currentColor}
  .fname{font-size:13px;font-weight:600;flex:1}.fname.you{color:var(--gold)}
  .fbar{flex:1.3;height:7px;background:#0a121b;overflow:hidden;max-width:90px;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .fbar span{display:block;height:100%;box-shadow:0 0 8px currentColor}
  .fnum{font-family:var(--mono);font-size:11px;color:var(--steel);min-width:30px;text-align:right}.fnum b{color:var(--bone)}
  .cmd{top:50%;right:22px;transform:translateY(-50%);width:298px;z-index:6}
  .cbanner{padding:15px 17px;border-bottom:1px solid #2c3c50;position:relative;overflow:hidden}
  .cbanner .ct{font-size:20px;font-weight:800;position:relative}.cbanner .co{font-size:11px;font-weight:600;margin-top:3px;position:relative}
  .ctag{position:absolute;top:15px;right:17px;font-family:var(--mono);font-size:10px;padding:4px 9px;background:rgba(0,0,0,.4);border:1px solid #2c3c50;letter-spacing:1px;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
  .cbody{padding:15px 17px 17px}
  .sbar{margin-bottom:13px}.sbar .sl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
  .sbar .sl .l{color:var(--steel);letter-spacing:.5px}.sbar .sl .n{font-family:var(--mono);color:var(--bone);font-weight:600}
  .track{height:7px;background:#0a121b;overflow:hidden;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .track span{display:block;height:100%}
  .meta2{display:flex;justify-content:space-between;font-size:11.5px;padding:9px 0;border-top:1px solid #1c2a38}
  .meta2 .l{color:var(--steel)}.meta2 .v{font-family:var(--mono);color:var(--bone)}
  .lastev{font-size:12px;line-height:1.5;color:#cdd6df;margin-top:6px}
  .threat{margin-top:12px;padding:10px 12px;font-size:12px;line-height:1.5;background:rgba(0,0,0,.32);border-left:3px solid var(--steel);color:#d2dae2;clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 calc(100% - 6px))}
  .threat.hi{border-color:var(--horde)}.threat.mid{border-color:var(--gold)}.threat.lo{border-color:var(--pact)}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:13px;font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;background:linear-gradient(180deg,#E5B658,#C9941F);color:#11161F;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:0 6px 18px rgba(217,168,69,.35)}
  .cta:hover{filter:brightness(1.08)}.cta.def{background:linear-gradient(180deg,#6ea0c8,#4a7da8);box-shadow:0 6px 18px rgba(91,141,184,.3);color:#fff}
  .ticker{position:absolute;bottom:0;left:0;right:0;height:38px;z-index:5;background:linear-gradient(180deg,rgba(6,14,26,.7),rgba(6,14,26,.96));border-top:1px solid #1a2836;display:flex;align-items:center;overflow:hidden}
  .ticker .tag{flex:0 0 auto;font-size:9px;letter-spacing:2px;color:var(--gold);padding:0 14px;border-right:1px solid #1a2836;height:100%;display:flex;align-items:center;background:rgba(0,0,0,.3)}
  .tkscroll{display:flex;gap:42px;white-space:nowrap;animation:scroll 38s linear infinite;padding-left:42px}
  .tkscroll:hover{animation-play-state:paused}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .tkitem{font-size:12.5px;color:#c2cad3}.tkitem b{color:var(--bone)}.tkitem .e{color:var(--gold)}.tkitem .h{color:var(--horde)}.tkitem .p{color:var(--pact)}
  .tkitem .tk{font-family:var(--mono);font-size:10px;color:var(--steel);margin-right:7px}
  @media(max-width:760px){.stand{display:none}.cmd{width:250px;right:10px}.resbar{flex-direction:column}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg class="world" id="world" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="sea" cx="50%" cy="36%" r="90%">
        <stop offset="0" stop-color="#5BBCF2"/><stop offset="50%" stop-color="#379FE0"/><stop offset="100%" stop-color="#1B6FB4"/>
      </radialGradient>
      <linearGradient id="cliff-lush" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8F6C3E"/><stop offset="60%" stop-color="#6E4F2B"/><stop offset="100%" stop-color="#4E3719"/>
      </linearGradient>
      <linearGradient id="cliff-volcano" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#A03524"/><stop offset="60%" stop-color="#7E2415"/><stop offset="100%" stop-color="#56150B"/>
      </linearGradient>
      <linearGradient id="cliff-snow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9AA9BD"/><stop offset="60%" stop-color="#76879D"/><stop offset="100%" stop-color="#55657A"/>
      </linearGradient>
      <linearGradient id="cliff-desert" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#C98336"/><stop offset="60%" stop-color="#A0621F"/><stop offset="100%" stop-color="#774611"/>
      </linearGradient>
      <filter id="ishadow" x="-60%" y="-60%" width="220%" height="240%">
        <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#0B3A66" flood-opacity="0.45"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect width="900" height="560" fill="url(#sea)"/>
    <g id="seaimg"></g>
    <g id="caustics"></g>
    <g id="stones"></g>
    <g id="clouds"></g>
    <g id="islands"></g>
  </svg>
  <div class="vig"></div>

  <div class="crest">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="16" width="480" height="480" rx="100" fill="#11161F" stroke="#232B3C" stroke-width="8"/>
      <g fill="#D9A845"><polygon points="200,176 86,136 102,162 200,204"/><polygon points="200,214 110,176 124,202 200,240"/><polygon points="312,176 426,136 410,162 312,204"/><polygon points="312,214 402,176 388,202 312,240"/><circle cx="256" cy="104" r="28" fill="none" stroke="#D9A845" stroke-width="18"/><rect x="176" y="158" width="160" height="32" rx="6"/><rect x="158" y="152" width="22" height="44" rx="4"/><rect x="332" y="152" width="22" height="44" rx="4"/><rect x="241" y="162" width="30" height="178"/><polygon points="241,340 271,340 256,388"/><path d="M140 300 Q256 426 372 300 L342 278 Q256 372 170 278 Z"/><polygon points="140,304 122,252 174,270"/><polygon points="372,304 390,252 338,270"/></g>
    </svg>
    <div><div class="nm">HOLDFAST</div><div class="sb">THE SUNDERED ISLES</div></div>
  </div>
  <div class="resbar">
    <div class="res"><span class="ic">🪙</span><div><div class="k">Flux</div><div class="v flux">340</div></div></div>
    <div class="res"><span class="ic">🏴</span><div><div class="k">Isles</div><div class="v gold">2</div></div></div>
    <div class="res clock"><div><div class="k"><span class="dot"></span>Tick 24 closes</div><div class="v" id="timer">11:58:04</div></div></div>
  </div>
  <div class="panel stand"><div class="ph"><span>Dominion</span><span>9 ISLES</span></div><div id="stand"></div></div>
  <div class="panel cmd" id="cmd"></div>
  <div class="ticker"><div class="tag">WAR LOG</div><div class="tkscroll" id="tk"></div></div>
</div>

<script>
const FCOL={you:'#D9A845','Iron Pact':'#5B8DB8','Ashen Horde':'#E25D38',Unclaimed:'#86946d'};
// faction -> biome: lush homeland, frozen Iron Pact, volcanic Ashen Horde,
// dry unclaimed badlands. The map reads the war at a glance.
const BIOME={you:'lush','Iron Pact':'snow','Ashen Horde':'volcano',Unclaimed:'desert'};
const tiles=[
  {id:'01',owner:'you',gar:120,since:19,last:'You took it from Iron Pact',x:195,y:185,s:1.0,sh:0,ta:[0.33,0.62]},
  {id:'02',owner:'you',gar:95,since:12,last:'Held against an Ashen assault',x:120,y:375,s:.82,sh:1,ta:[0.40,0.16]},
  {id:'03',owner:'Unclaimed',gar:60,since:null,last:'Open ground — never claimed',x:415,y:118,s:.74,sh:2},
  {id:'04',owner:'Iron Pact',gar:110,since:15,last:'Iron Pact reinforced, +30',x:470,y:265,s:.95,sh:1,ta:[0.55,0.66]},
  {id:'05',owner:'Unclaimed',gar:65,since:null,last:'Contested twice, never taken',x:295,y:330,s:.7,sh:0},
  {id:'06',owner:'Ashen Horde',gar:140,since:20,last:'Three assaults repelled',x:628,y:158,s:1.05,sh:2,ta:[0.47,0.44]},
  {id:'07',owner:'Unclaimed',gar:55,since:null,last:'Open ground, eastern edge',x:540,y:455,s:.68,sh:1},
  {id:'08',owner:'Ashen Horde',gar:100,since:17,last:'Ashen Horde captured it',x:705,y:345,s:.88,sh:0,ta:[0.62,0.52]},
  {id:'09',owner:'Iron Pact',gar:80,since:14,last:'Light Iron Pact outpost',x:400,y:470,s:.78,sh:2,ta:[0.38,0.63]},
];
const blobs=[
  "M-52,-4 C-54,-26 -30,-40 -6,-35 C18,-40 46,-30 52,-6 C58,16 40,36 12,38 C-14,42 -44,30 -52,-4 Z",
  "M-46,6 C-56,-14 -34,-38 -8,-33 C20,-42 50,-24 46,2 C50,24 26,40 2,35 C-24,42 -46,26 -46,6 Z",
  "M-50,0 C-48,-26 -22,-38 4,-33 C30,-38 50,-22 49,4 C46,28 24,38 -2,35 C-30,40 -52,22 -50,0 Z",
];
const routes=[[0,2],[0,4],[2,3],[4,3],[3,5],[3,8],[4,8],[1,4],[8,5],[8,6]];
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
let selected=5;

/* ---------------- optional sprite assets (ui/assets/) ----------------
   Drop PNGs there and they replace the procedural art automatically;
   anything missing falls back to the SVG drawings. See assets/README.md. */
const ISLAND_ART=tiles_i=>'assets/isl-'+(tiles_i+1)+'.png'; // one painting per tile
const CLOUD_ART=['assets/cloud-1.png','assets/cloud-2.png','assets/cloud-3.png','assets/cloud-4.png'];
const ROCK_ART=['assets/rock-1.png','assets/rock-2.png'];
const TOWER_ART=[1,2,3,4,5].map(n=>'assets/tower-'+n+'.png');
const SKY_ART='assets/sky.png';
// garrison -> mage-tower tier (matches fortLabel bands, finer-grained)
function towerTier(g){return g>=130?5:g>=110?4:g>=90?3:g>=70?2:1;}
const sprites={};let skyOk=false;
const SPRITE_W=198;   // on-map island sprite width before per-isle scale
function loadImg(src){return new Promise(res=>{const im=new Image();
  im.onload=()=>res({ok:true,w:im.naturalWidth,h:im.naturalHeight});
  im.onerror=()=>res({ok:false});im.src=src;});}
async function preloadAssets(){
  const urls=[SKY_ART,...CLOUD_ART,...ROCK_ART,...TOWER_ART];
  for(let i=0;i<9;i++)urls.push(ISLAND_ART(i));
  await Promise.all(urls.map(async u=>{sprites[u]=await loadImg(u);}));
  skyOk=sprites[SKY_ART].ok;
}

/* ---------------- sea dressing ---------------- */
function drawSea(){
  const g=document.getElementById('seaimg');g.innerHTML='';
  if(!skyOk)return;
  const im=el('image',{width:900,height:560,preserveAspectRatio:'xMidYMid slice'});
  im.setAttribute('href',SKY_ART);g.appendChild(im);
}
function drawCaustics(){
  const g=document.getElementById('caustics');g.innerHTML='';
  if(skyOk)return; // open sky needs no water light
  const spots=[[90,60,80,26],[300,40,60,18],[560,70,95,30],[820,50,55,18],
    [60,250,55,20],[250,470,90,28],[480,520,70,22],[700,500,85,26],
    [860,260,60,22],[640,300,50,16],[180,140,40,14],[420,200,46,15]];
  spots.forEach(([x,y,rx,ry],i)=>{
    const c=el('ellipse',{cx:x,cy:y,rx:rx,ry:ry,fill:'#7FD0F7',opacity:'.32',class:'caustic'});
    c.setAttribute('filter','url(#soft)');c.style.animationDuration=(6+(i%4)*1.7)+'s';c.style.animationDelay=(-i*1.1)+'s';
    g.appendChild(c);
    g.appendChild(el('ellipse',{cx:x+rx*.3,cy:y-ry*.2,rx:rx*.45,ry:ry*.45,fill:'#A9E2FB',opacity:'.28'}));
  });
}
function drawClouds(){const g=document.getElementById('clouds');g.innerHTML='';
  [[110,70,1,52,0],[600,470,1.25,66,1],[780,100,.9,58,2],[330,520,1.1,72,3],[450,60,.7,62,1]]
  .forEach(([x,y,sc,dur,ci],i)=>{
    const pos=el('g',{transform:'translate('+x+','+y+') scale('+sc+')'});
    const c=el('g',{class:'cloud'});c.style.animationDuration=dur+'s';c.style.animationDelay=(-i*9)+'s';
    const art=CLOUD_ART[ci%CLOUD_ART.length];
    if(sprites[art]&&sprites[art].ok){
      const W=180,H=W*sprites[art].h/sprites[art].w;
      const im=el('image',{x:-W/2,y:-H/2,width:W,height:H});im.setAttribute('href',art);
      c.appendChild(im);
    }else{
      c.appendChild(el('ellipse',{cx:0,cy:0,rx:44,ry:14,fill:'#EAF8FE',opacity:'.5'}));
      c.appendChild(el('ellipse',{cx:24,cy:5,rx:28,ry:10,fill:'#EAF8FE',opacity:'.45'}));
      c.appendChild(el('ellipse',{cx:-26,cy:6,rx:24,ry:9,fill:'#EAF8FE',opacity:'.45'}));
    }
    pos.appendChild(c);g.appendChild(pos);});}

/* stepping-stone rocks along the sea routes (replaces dashed lines) */
function drawStones(){
  const g=document.getElementById('stones');g.innerHTML='';
  routes.forEach(([a,b],i)=>{
    const A=tiles[a],B=tiles[b];
    const mx=(A.x+B.x)/2+((i%3)-1)*14, my=(A.y+B.y)/2+18+((i%2)?8:-6);
    const s=.6+(i%3)*.16;
    const grp=el('g',{transform:'translate('+mx+','+my+') scale('+s+')'});
    const rockArt=ROCK_ART[i%ROCK_ART.length];
    if(sprites[rockArt]&&sprites[rockArt].ok){
      const W=34,H=W*sprites[rockArt].h/sprites[rockArt].w;
      grp.innerHTML='<image href="'+rockArt+'" x="'+(-W/2)+'" y="'+(-H*.6)+'" width="'+W+'" height="'+H+'"/>';
      g.appendChild(grp);return;
    }
    if(skyOk){g.appendChild(grp);return;} // no foam blobs in the open sky
    grp.innerHTML=
      '<ellipse cx="0" cy="3" rx="22" ry="8" fill="#EAF8FE" opacity=".55"/>'+
      '<polygon points="-12,3 -10,-4 -2,-7 7,-4 10,2 1,6" fill="#8A5B3A"/>'+
      '<polygon points="-10,-4 -2,-7 7,-4 -1,-1" fill="#A9744C"/>'+
      '<polygon points="-12,3 1,6 0,2 -8,1" fill="#6E462B"/>'+
      ((i%2===0)?'<g transform="translate(16,6) scale(.55)"><polygon points="-12,3 -10,-4 -2,-7 7,-4 10,2 1,6" fill="#8A5B3A"/><polygon points="-10,-4 -2,-7 7,-4 -1,-1" fill="#A9744C"/></g>':'');
    g.appendChild(grp);
  });
}

/* ---------------- biome decorations (island-local coords) ---------------- */
function bush(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'+
  '<ellipse cx="1" cy="7" rx="15" ry="4.5" fill="rgba(15,70,20,.28)"/>'+
  '<circle cx="-7" cy="0" r="9" fill="#4E9A33"/><circle cx="6" cy="-2" r="10" fill="#5FB23F"/>'+
  '<circle cx="0" cy="4" r="9" fill="#56A839"/><circle cx="4" cy="-6" r="4.5" fill="#8ED95E"/>'+
  '<circle cx="-9" cy="-4" r="3.5" fill="#7CCB52"/></g>';}
function rock(x,y,s,base,lit,dark){base=base||'#8C949E';lit=lit||'#B6BEC8';dark=dark||'#697079';
  return '<g transform="translate('+x+','+y+') scale('+s+')">'+
  '<polygon points="-10,6 -12,-2 -4,-8 6,-7 11,0 8,7" fill="'+base+'"/>'+
  '<polygon points="-4,-8 6,-7 2,-1 -6,-2" fill="'+lit+'"/>'+
  '<polygon points="-10,6 8,7 6,3 -6,3" fill="'+dark+'"/></g>';}
function tuft(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M0,0 l-2,-6 M0,0 l1,-7 M0,0 l3,-5" stroke="#3E8A2C" stroke-width="1.4" stroke-linecap="round" fill="none"/></g>';}
function flower(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="1.6" fill="#FFE066"/>';}

function pine(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'+
  '<ellipse cx="0" cy="9" rx="9" ry="3" fill="rgba(40,70,110,.25)"/>'+
  '<rect x="-1.8" y="2" width="3.6" height="7" fill="#6E4226"/>'+
  '<polygon points="0,-26 11,-6 -11,-6" fill="#2F8049"/>'+
  '<polygon points="0,-18 13,2 -13,2" fill="#2A7242"/>'+
  '<polygon points="0,-26 5.5,-16 -5.5,-16" fill="#FFFFFF"/>'+
  '<path d="M-10,-7 Q0,-13 10,-7 L8,-4 Q0,-9 -8,-4 Z" fill="#FFFFFF"/>'+
  '<path d="M-12,1 Q0,-5 12,1 L10,3 Q0,-2 -10,3 Z" fill="#F2F8FC" opacity=".9"/></g>';}
function mound(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'+
  '<ellipse cx="0" cy="0" rx="13" ry="6.5" fill="#FFFFFF"/>'+
  '<path d="M-13,1 A13,6.5 0 0 0 13,1 L13,3 A13,6.5 0 0 1 -13,3 Z" fill="#C9D8E4"/>'+
  '<ellipse cx="-4" cy="-2" rx="5" ry="2.2" fill="#F4FAFE"/></g>';}

function volcano(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'+
  '<ellipse cx="0" cy="13" rx="20" ry="5" fill="rgba(40,5,0,.3)"/>'+
  '<path d="M-19,12 L-8,-13 L8,-13 L19,12 Z" fill="#7E2415"/>'+
  '<path d="M-19,12 L-8,-13 L-2,-13 L-9,12 Z" fill="#963023"/>'+
  '<path d="M10,-6 L19,12 L8,12 Z" fill="#5E180C"/>'+
  '<ellipse cx="0" cy="-13" rx="9" ry="3.4" fill="#4A0F0A"/>'+
  '<g class="lava"><ellipse cx="0" cy="-13.4" rx="6" ry="2.1" fill="#FF8C1A"/>'+
  '<path d="M-3,-14 Q0,-15.4 3.4,-13.6 Q0,-12.4 -3,-14 Z" fill="#FFD43B"/>'+
  '<path d="M5,-12 Q8,-4 5.4,2 Q6.8,-5 3.4,-11 Z" fill="#FF8C1A"/>'+
  '<circle cx="-5" cy="-19" r="1.1" fill="#FFD43B"/><circle cx="4" cy="-21" r="0.9" fill="#FF8C1A"/></g></g>';}
function rubble(x,y,s){return rock(x,y,s,'#8A3B26','#A85638','#5E2415');}

function cactus(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'+
  '<ellipse cx="0" cy="9" rx="9" ry="3" fill="rgba(90,50,0,.3)"/>'+
  '<rect x="-4" y="-13" width="8" height="22" rx="4" fill="#3E9B4F"/>'+
  '<path d="M-4,-2 q-6,-1 -6,-8 l3,0 q0,5 3,5 Z" fill="#46A857"/>'+
  '<path d="M4,2 q6,-1 6,-9 l-3,0 q0,6 -3,6 Z" fill="#46A857"/>'+
  '<line x1="-1.4" y1="-11" x2="-1.4" y2="7" stroke="#2F7A3C" stroke-width="1"/>'+
  '<line x1="1.6" y1="-11" x2="1.6" y2="7" stroke="#2F7A3C" stroke-width="1"/>'+
  '<circle cx="0" cy="-13" r="1.6" fill="#E25D6B"/></g>';}
function slab(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'+
  '<ellipse cx="0" cy="12" rx="18" ry="4.5" fill="rgba(90,40,0,.28)"/>'+
  '<polygon points="-14,11 -11,-14 -2,-18 4,-13 7,11" fill="#A8542B"/>'+
  '<polygon points="-11,-14 -2,-18 4,-13 -4,-9" fill="#C97442"/>'+
  '<polygon points="4,-13 7,11 -1,11 -4,-9" fill="#7E3D1E"/>'+
  '<polygon points="8,2 11,-7 17,-9 20,-3 18,8 11,9" fill="#A8542B"/>'+
  '<polygon points="11,-7 17,-9 20,-3 13,-2" fill="#C97442"/></g>';}

const DECOR={
  lush:(g)=>bush(-24,-8,1)+bush(8,-16,.85)+bush(20,4,1.05)+
    rock(-4,8,.9)+rock(-34,4,.6)+
    tuft(-14,-18)+tuft(28,-8)+tuft(2,16)+flower(-18,2)+flower(12,12)+flower(34,-4),
  volcano:(g)=>volcano(-13,-4,1.05)+(g>=120?volcano(17,-11,.72):'')+
    rubble(20,8,.8)+rubble(-32,5,.6)+rubble(4,14,.5),
  snow:(g)=>pine(-24,-6,.95)+pine(-4,-15,.8)+pine(15,-3,1.05)+
    mound(2,12,1)+mound(-15,7,.7)+rock(30,6,.55,'#9AA9BD','#C7D3DF','#71808F'),
  desert:(g)=>slab(15,-9,1)+cactus(-19,-6,1)+cactus(-3,5,.7)+
    rubble(30,7,.55)+tuft(-30,2)+tuft(8,14),
};
const TOP={
  lush:{base:'#63B83E',lit:'#85D45C',rim:'#EFE3AE',cliff:'url(#cliff-lush)'},
  volcano:{base:'#B33524',lit:'#C9523B',rim:'#E0B49A',cliff:'url(#cliff-volcano)'},
  snow:{base:'#EDF3F8',lit:'#FFFFFF',rim:'#FFFFFF',cliff:'url(#cliff-snow)'},
  desert:{base:'#E8A93C',lit:'#F4C463',rim:'#F6E2B0',cliff:'url(#cliff-desert)'},
};

function drawIslands(){
  const g=document.getElementById('islands');g.innerHTML='';
  tiles.forEach((t,i)=>{
    const col=FCOL[t.owner];const blob=blobs[t.sh];
    const biome=BIOME[t.owner];const top=TOP[biome];
    const wrap=el('g',{class:'island'});wrap.onclick=()=>select(i);
    const art=ISLAND_ART(i);const sp=sprites[art];const useSprite=!!(sp&&sp.ok);

    // anchored water dressing (sprites/sky need none of it)
    if(!useSprite&&!skyOk){
      const sh=el('ellipse',{cx:t.x,cy:t.y+30*t.s,rx:56*t.s,ry:16*t.s,fill:'#0B3A66',opacity:'.35'});
      sh.setAttribute('filter','url(#soft)');wrap.appendChild(sh);
      const foamOuter=el('path',{d:blob,transform:'translate('+t.x+','+(t.y+8)+') scale('+(t.s*1.42)+','+(t.s*1.30)+')',fill:'#8FD3F2',opacity:'.5'});
      foamOuter.setAttribute('filter','url(#soft)');wrap.appendChild(foamOuter);
      wrap.appendChild(el('path',{d:blob,transform:'translate('+t.x+','+(t.y+6)+') scale('+(t.s*1.22)+','+(t.s*1.14)+')',fill:'#EAF8FE',opacity:'.85'}));
    }

    // bobbing island body (outer g = position attribute, inner g = CSS anim)
    const pos=el('g',{transform:'translate('+t.x+','+t.y+') scale('+t.s+')'});
    const inner=el('g',{class:'bob'});
    inner.style.animationDuration=(4.5+(i%3)*0.8)+'s';inner.style.animationDelay=(-i*0.6)+'s';

    const overlays=
      (t.owner!=='Unclaimed'?'<rect x="-0.8" y="-54" width="1.6" height="20" fill="#E8E2D2"/><path d="M0.8,-53 l18,5 l-18,5 Z" fill="'+col+'" stroke="rgba(0,0,0,.3)" stroke-width=".5"/>':'')+
      '<g transform="translate(0,24)"><path d="M-16,0 L16,0 L16,11 L0,17 L-16,11 Z" fill="rgba(8,20,34,.85)" stroke="'+col+'" stroke-width="1.5"/><text x="0" y="9" class="itxt" font-size="14">'+t.gar+'</text></g>'+
      '<text x="0" y="48" class="ilabel">'+(t.owner==='you'?'YOURS':t.owner==='Unclaimed'?'ISLE '+t.id:t.owner.toUpperCase())+'</text>';

    if(useSprite){
      const W=SPRITE_W,H=W*sp.h/sp.w;
      const topY=-H*0.45;
      // held isles raise a mage tower at a hand-picked ground anchor;
      // the variant tracks the garrison tier
      let tower='';
      if(t.owner!=='Unclaimed'&&t.ta){
        const ta=TOWER_ART[towerTier(t.gar)-1];const ts=sprites[ta];
        if(ts&&ts.ok){
          const Tw=W*0.17,Th=Tw*ts.h/ts.w;
          const bx=(t.ta[0]-0.5)*W, by=topY+t.ta[1]*H;
          tower='<image href="'+ta+'" x="'+(bx-Tw/2)+'" y="'+(by-Th+2)+'" width="'+Tw+'" height="'+Th+'"/>';
        }
      }
      // no rings: name + score float ABOVE the isle; selection = glow
      if(selected===i){
        inner.style.filter='brightness(1.12) drop-shadow(0 0 12px rgba(255,255,255,.65))';
      }
      inner.innerHTML=
        '<image href="'+art+'" x="'+(-W/2)+'" y="'+topY+'" width="'+W+'" height="'+H+'"/>'+
        tower+
        '<text x="0" y="'+(topY-12)+'" class="ilabel">'+
          (t.owner==='you'?'YOURS':t.owner==='Unclaimed'?'ISLE '+t.id:t.owner.toUpperCase())+'</text>'+
        '<g transform="translate(0,'+(topY-8)+')"><path d="M-16,0 L16,0 L16,11 L0,17 L-16,11 Z" fill="rgba(8,20,34,.85)" stroke="'+col+'" stroke-width="1.5"/><text x="0" y="9" class="itxt" font-size="14">'+t.gar+'</text></g>';
      pos.appendChild(inner);wrap.appendChild(pos);g.appendChild(wrap);
      return;
    }
    inner.innerHTML=
      // chunky volumetric cliff: three stacked plates
      '<g filter="url(#ishadow)">'+
        '<path d="'+blob+'" transform="translate(0,16) scale(1.0,0.96)" fill="'+top.cliff+'"/>'+
        '<path d="'+blob+'" transform="translate(0,8)" fill="'+top.cliff+'"/>'+
        '<path d="'+blob+'" fill="'+top.cliff+'"/>'+
      '</g>'+
      // beach/rim ring then lit top surface
      '<path d="'+blob+'" transform="translate(0,-7) scale(0.985)" fill="'+top.rim+'"/>'+
      '<g transform="translate(0,-10) scale(0.93)">'+
        '<path d="'+blob+'" fill="'+top.base+'"/>'+
        '<path d="'+blob+'" fill="'+top.lit+'" opacity=".85" transform="translate(-4,-6) scale(0.78)"/>'+
        '<path d="'+blob+'" fill="rgba(0,30,10,.16)" transform="translate(5,7) scale(0.88)"/>'+
      '</g>'+
      (selected===i?'<path d="'+blob+'" transform="translate(0,-10) scale(0.93)" fill="none" stroke="#FFFFFF" stroke-width="3.5" filter="url(#glow)" style="animation:ping 1.7s ease-out infinite"/>':'')+
      '<path d="'+blob+'" transform="translate(0,-10) scale(0.93)" fill="none" stroke="'+col+'" stroke-width="'+(selected===i?4:2.5)+'" opacity=".95"/>'+
      // biome decorations on the surface
      '<g transform="translate(0,-12)">'+DECOR[biome](t.gar)+'</g>'+
      overlays;
    pos.appendChild(inner);wrap.appendChild(pos);g.appendChild(wrap);
  });
}

function renderStand(){
  const counts={};tiles.forEach(t=>{counts[t.owner]=(counts[t.owner]||0)+1;});
  const order=['you','Ashen Horde','Iron Pact','Unclaimed'];const box=document.getElementById('stand');box.innerHTML='';
  order.forEach(f=>{const c=counts[f]||0,pct=Math.round(c/9*100);const d=document.createElement('div');d.className='frow';
    d.innerHTML='<span class="fdot" style="background:'+FCOL[f]+';color:'+FCOL[f]+'"></span><span class="fname '+(f==='you'?'you':'')+'">'+(f==='you'?'You':f)+'</span><span class="fbar"><span style="width:'+pct+'%;background:'+FCOL[f]+';color:'+FCOL[f]+'"></span></span><span class="fnum"><b>'+c+'</b>/9</span>';
    box.appendChild(d);});}
function fortLabel(g){return g>=120?'FORTRESS':g>=90?'FORTIFIED':'OUTPOST';}
function select(i){selected=i;drawIslands();
  const t=tiles[i];const col=FCOL[t.owner];const def=(Math.pow(t.gar,0.5)*1.3).toFixed(1);
  const garPct=Math.min(100,t.gar/180*100),defPct=Math.min(100,def/20*100);let threat,tcls;
  if(t.owner==='you'){threat='Yours. Earns +4 Flux each tick. Its garrison hardens slowly while unchallenged.';tcls='lo';}
  else if(t.gar>=120){threat='High threat. Every repelled assault has thickened these walls. Breaking it needs a heavy commitment — the defender still holds the edge.';tcls='hi';}
  else if(t.owner==='Unclaimed'){threat='Open ground. Lightly held and unclaimed — your cheapest path to expand.';tcls='mid';}
  else{threat='Moderate threat. Worth taking if you commit enough Flux to swing past the defender advantage.';tcls='mid';}
  document.getElementById('cmd').innerHTML=
    '<div class="cbanner"><div style="position:absolute;inset:0;background:'+col+';opacity:.14"></div><div class="ct">Isle '+t.id+'</div><div class="co" style="color:'+col+'">'+(t.owner==='you'?'Held by you':t.owner)+'</div><div class="ctag">'+fortLabel(t.gar)+'</div></div>'+
    '<div class="cbody"><div class="sbar"><div class="sl"><span class="l">GARRISON</span><span class="n">'+t.gar+'</span></div><div class="track"><span style="width:'+garPct+'%;background:'+col+'"></span></div></div>'+
    '<div class="sbar"><div class="sl"><span class="l">DEFENSE RATING</span><span class="n">'+def+'</span></div><div class="track"><span style="width:'+defPct+'%;background:'+col+'"></span></div></div>'+
    '<div class="meta2"><span class="l">Held since</span><span class="v">'+(t.since?'Tick '+t.since:'—')+'</span></div><div class="lastev">⚑ '+t.last+'</div><div class="threat '+tcls+'">'+threat+'</div>'+
    (t.owner!=='you'?'<div class="cta">⚔ Issue orders · @HoldfastGM</div>':'<div class="cta def">🛡 Reinforce · @HoldfastGM</div>')+'</div>';
}

const logs=[
  {tk:'T24',tx:'Dawn breaks over the isles. The <span class="h">Ashen Horde</span> stirs in the east.'},
  {tk:'T23',tx:'<span class="h">Ashen Horde</span> seized <b>Isle 07</b> and now presses your waters.'},
  {tk:'T23',tx:'<span class="p">Iron Pact</span> reinforced <b>Isle 04</b> — garrison now 110.'},
  {tk:'T22',tx:'<span class="e">You</span> held <b>Isle 02</b> against an Ashen landing (61% — won).'},
  {tk:'T21',tx:'<b>Isle 06</b> repelled its third assault. It is a fortress now.'},
  {tk:'T19',tx:'<span class="e">You</span> took <b>Isle 01</b> from <span class="p">Iron Pact</span>, +55 Flux spoils.'},
];
const tk=document.getElementById('tk');logs.concat(logs).forEach(l=>{const s=document.createElement('span');s.className='tkitem';s.innerHTML='<span class="tk">'+l.tk+'</span>'+l.tx;tk.appendChild(s);});

let secs=43084;setInterval(()=>{secs--;const h=String(Math.floor(secs/3600)).padStart(2,'0'),m=String(Math.floor(secs%3600/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s;},1000);

preloadAssets().then(()=>{
  drawSea();drawCaustics();drawStones();drawClouds();drawIslands();renderStand();select(5);
});
</script>
</body>

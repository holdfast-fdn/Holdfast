<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Holdfast — The Sundered Isles</title>
<style>
  :root{
    --bone:#F2ECDE; --steel:#9aa7b4; --ember:#E8622C; --gold:#E0A848;
    --you:#E8622C; --pact:#5B8DB8; --horde:#C0413B;
    --sans:'Helvetica Neue',Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--bone);background:#06121c;overflow:hidden}
  .stage{position:relative;width:100%;height:100vh;overflow:hidden}
  svg.world{position:absolute;inset:0;width:100%;height:100%}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(72% 66% at 50% 44%, transparent 46%, rgba(4,10,18,.5) 82%, rgba(3,8,14,.85) 100%)}
  .island{cursor:pointer}
  .bob{animation:bob ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .island:hover .bob{filter:brightness(1.12)}
  .itxt{font-family:var(--mono);font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px}
  .ilabel{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:1px;text-anchor:middle;pointer-events:none;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2.5px}
  @keyframes ping{0%{opacity:.7;transform:scale(.95)}70%{opacity:0;transform:scale(1.12)}100%{opacity:0}}
  @keyframes drift{0%{transform:translateX(-60px)}100%{transform:translateX(120px)}}
  .cloud{animation:drift linear infinite;opacity:.09}
  @keyframes shimmer{0%,100%{opacity:.35}50%{opacity:.6}}
  .caustic{animation:shimmer ease-in-out infinite}

  /* HUD */
  .crest{position:absolute;top:20px;left:22px;display:flex;align-items:center;gap:13px;z-index:5}
  .crest svg{width:46px;height:46px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
  .crest .nm{font-weight:800;font-size:21px;letter-spacing:-.4px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  .crest .sb{font-size:9.5px;letter-spacing:3.5px;color:var(--gold);margin-top:4px}
  .resbar{position:absolute;top:20px;right:22px;display:flex;gap:8px;z-index:5}
  .res{display:flex;align-items:center;gap:9px;padding:9px 15px;background:linear-gradient(180deg,rgba(20,30,42,.9),rgba(10,18,28,.9));backdrop-filter:blur(8px);border:1px solid #314150;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .res .ic{font-size:16px}.res .k{font-size:8.5px;letter-spacing:1.5px;color:var(--steel);text-transform:uppercase}
  .res .v{font-family:var(--mono);font-size:17px;font-weight:700}.res .v.flux{color:var(--ember)}.res .v.gold{color:var(--gold)}
  .clock .dot{width:6px;height:6px;border-radius:50%;background:var(--ember);display:inline-block;margin-right:6px;animation:pl 2.2s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(232,98,44,.5)}70%{box-shadow:0 0 0 6px rgba(232,98,44,0)}100%{box-shadow:0 0 0 0 rgba(232,98,44,0)}}
  .panel{position:absolute;background:linear-gradient(180deg,rgba(18,27,38,.93),rgba(9,16,25,.95));backdrop-filter:blur(10px);border:1px solid #314150;z-index:5;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
  .ph{font-size:9.5px;letter-spacing:2.5px;color:var(--steel);text-transform:uppercase;padding:13px 16px 0;display:flex;justify-content:space-between}
  .stand{bottom:54px;left:22px;width:284px;padding-bottom:14px}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 16px 0}
  .fdot{width:9px;height:9px;border-radius:2px;flex:0 0 9px;box-shadow:0 0 8px currentColor}
  .fname{font-size:13px;font-weight:600;flex:1}.fname.you{color:var(--ember)}
  .fbar{flex:1.3;height:7px;background:#0a121b;overflow:hidden;max-width:90px;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .fbar span{display:block;height:100%;box-shadow:0 0 8px currentColor}
  .fnum{font-family:var(--mono);font-size:11px;color:var(--steel);min-width:30px;text-align:right}.fnum b{color:var(--bone)}
  .cmd{top:50%;right:22px;transform:translateY(-50%);width:298px;z-index:6}
  .cbanner{padding:15px 17px;border-bottom:1px solid #314150;position:relative;overflow:hidden}
  .cbanner .ct{font-size:20px;font-weight:800;position:relative}.cbanner .co{font-size:11px;font-weight:600;margin-top:3px;position:relative}
  .ctag{position:absolute;top:15px;right:17px;font-family:var(--mono);font-size:10px;padding:4px 9px;background:rgba(0,0,0,.4);border:1px solid #314150;letter-spacing:1px;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
  .cbody{padding:15px 17px 17px}
  .sbar{margin-bottom:13px}.sbar .sl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
  .sbar .sl .l{color:var(--steel);letter-spacing:.5px}.sbar .sl .n{font-family:var(--mono);color:var(--bone);font-weight:600}
  .track{height:7px;background:#0a121b;overflow:hidden;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
  .track span{display:block;height:100%}
  .meta2{display:flex;justify-content:space-between;font-size:11.5px;padding:9px 0;border-top:1px solid #1c2a38}
  .meta2 .l{color:var(--steel)}.meta2 .v{font-family:var(--mono);color:var(--bone)}
  .lastev{font-size:12px;line-height:1.5;color:#cdd6df;margin-top:6px}
  .threat{margin-top:12px;padding:10px 12px;font-size:12px;line-height:1.5;background:rgba(0,0,0,.32);border-left:3px solid var(--steel);color:#d2dae2;clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 calc(100% - 6px))}
  .threat.hi{border-color:var(--horde)}.threat.mid{border-color:var(--gold)}.threat.lo{border-color:var(--pact)}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:13px;font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;background:linear-gradient(180deg,#f0703a,#d8531f);color:#fff;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:0 6px 18px rgba(232,98,44,.35)}
  .cta:hover{filter:brightness(1.08)}.cta.def{background:linear-gradient(180deg,#6ea0c8,#4a7da8);box-shadow:0 6px 18px rgba(91,141,184,.3)}
  .ticker{position:absolute;bottom:0;left:0;right:0;height:38px;z-index:5;background:linear-gradient(180deg,rgba(6,14,22,.55),rgba(6,14,22,.95));border-top:1px solid #1a2836;display:flex;align-items:center;overflow:hidden}
  .ticker .tag{flex:0 0 auto;font-size:9px;letter-spacing:2px;color:var(--gold);padding:0 14px;border-right:1px solid #1a2836;height:100%;display:flex;align-items:center;background:rgba(0,0,0,.3)}
  .tkscroll{display:flex;gap:42px;white-space:nowrap;animation:scroll 38s linear infinite;padding-left:42px}
  .tkscroll:hover{animation-play-state:paused}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .tkitem{font-size:12.5px;color:#c2cad3}.tkitem b{color:var(--bone)}.tkitem .e{color:var(--ember)}.tkitem .h{color:var(--horde)}.tkitem .p{color:var(--pact)}
  .tkitem .tk{font-family:var(--mono);font-size:10px;color:var(--steel);margin-right:7px}
  @media(max-width:760px){.stand{display:none}.cmd{width:250px;right:10px}.resbar{flex-direction:column}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg class="world" id="world" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="sea" cx="50%" cy="38%" r="85%">
        <stop offset="0" stop-color="#207690"/><stop offset="45%" stop-color="#125066"/><stop offset="100%" stop-color="#082a3d"/>
      </radialGradient>
      <filter id="water"><feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2" seed="7" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.40  0 0 0 0 0.48  0 0 0 0.55 0"/></filter>
      <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7a6346"/><stop offset="55%" stop-color="#54422c"/><stop offset="100%" stop-color="#33271a"/>
      </linearGradient>
      <filter id="ishadow" x="-60%" y="-60%" width="220%" height="240%">
        <feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#03101a" flood-opacity="0.5"/></filter>
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect width="900" height="560" fill="url(#sea)"/>
    <rect width="900" height="560" filter="url(#water)" opacity="0.5" class="caustic" style="animation-duration:7s"/>
    <g id="routes"></g>
    <g id="clouds"></g>
    <g id="islands"></g>
  </svg>
  <div class="vig"></div>

  <div class="crest">
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="8" width="224" height="224" rx="48" fill="#11161D" stroke="#314150" stroke-width="3"/>
      <path d="M62 78 L82 58 L98 58 L98 184 L62 184 Z" fill="#ECE6D8"/>
      <path d="M142 58 L158 58 L178 78 L178 184 L142 184 Z" fill="#ECE6D8"/>
      <rect x="98" y="104" width="44" height="34" fill="#ECE6D8"/>
      <path d="M107 138 L107 120 Q107 109 120 109 Q133 109 133 120 L133 138 Z" fill="#E8622C"/>
    </svg>
    <div><div class="nm">HOLDFAST</div><div class="sb">THE SUNDERED ISLES</div></div>
  </div>
  <div class="resbar">
    <div class="res"><span class="ic">🪙</span><div><div class="k">Flux</div><div class="v flux">340</div></div></div>
    <div class="res"><span class="ic">🏴</span><div><div class="k">Isles</div><div class="v gold">2</div></div></div>
    <div class="res clock"><div><div class="k"><span class="dot"></span>Tick 24 closes</div><div class="v" id="timer">11:58:04</div></div></div>
  </div>
  <div class="panel stand"><div class="ph"><span>Dominion</span><span>9 ISLES</span></div><div id="stand"></div></div>
  <div class="panel cmd" id="cmd"></div>
  <div class="ticker"><div class="tag">WAR LOG</div><div class="tkscroll" id="tk"></div></div>
</div>

<script>
const FCOL={you:'#E8622C','Iron Pact':'#5B8DB8','Ashen Horde':'#C0413B',Unclaimed:'#86946d'};
const tiles=[
  {id:'01',owner:'you',gar:120,since:19,last:'You took it from Iron Pact',x:230,y:178,s:1.0,sh:0},
  {id:'02',owner:'you',gar:95,since:12,last:'Held against an Ashen assault',x:142,y:342,s:.82,sh:1},
  {id:'03',owner:'Unclaimed',gar:60,since:null,last:'Open ground — never claimed',x:388,y:118,s:.78,sh:2},
  {id:'04',owner:'Iron Pact',gar:110,since:15,last:'Iron Pact reinforced, +30',x:482,y:258,s:.95,sh:1},
  {id:'05',owner:'Unclaimed',gar:65,since:null,last:'Contested twice, never taken',x:332,y:312,s:.74,sh:0},
  {id:'06',owner:'Ashen Horde',gar:140,since:20,last:'Three assaults repelled',x:652,y:168,s:1.12,sh:2},
  {id:'07',owner:'Unclaimed',gar:55,since:null,last:'Open ground, eastern edge',x:560,y:412,s:.7,sh:1},
  {id:'08',owner:'Ashen Horde',gar:100,since:17,last:'Ashen Horde captured it',x:748,y:342,s:.9,sh:0},
  {id:'09',owner:'Iron Pact',gar:80,since:14,last:'Light Iron Pact outpost',x:442,y:442,s:.78,sh:2},
];
const blobs=[
  "M-52,-4 C-54,-26 -30,-40 -6,-35 C18,-40 46,-30 52,-6 C58,16 40,36 12,38 C-14,42 -44,30 -52,-4 Z",
  "M-46,6 C-56,-14 -34,-38 -8,-33 C20,-42 50,-24 46,2 C50,24 26,40 2,35 C-24,42 -46,26 -46,6 Z",
  "M-50,0 C-48,-26 -22,-38 4,-33 C30,-38 50,-22 49,4 C46,28 24,38 -2,35 C-30,40 -52,22 -50,0 Z",
];
const routes=[[0,2],[0,4],[2,3],[4,3],[3,5],[3,8],[4,8],[1,4],[8,5],[8,6]];
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
let selected=5;

function drawRoutes(){const g=document.getElementById('routes');g.innerHTML='';
  routes.forEach(([a,b])=>{const A=tiles[a],B=tiles[b];
    g.appendChild(el('line',{x1:A.x,y1:A.y+24,x2:B.x,y2:B.y+24,stroke:'#bfe0ea','stroke-width':'1.5','stroke-dasharray':'2 7','stroke-linecap':'round',opacity:'.25'}));});}
function drawClouds(){const g=document.getElementById('clouds');
  [[120,90,1,52],[600,470,1.4,66],[770,120,1,58]].forEach(([x,y,s,dur],i)=>{
    const c=el('g',{class:'cloud',transform:'translate('+x+','+y+') scale('+s+')'});c.style.animationDuration=dur+'s';c.style.animationDelay=(-i*9)+'s';
    c.appendChild(el('ellipse',{cx:0,cy:0,rx:46,ry:16,fill:'#dfeef2'}));
    c.appendChild(el('ellipse',{cx:26,cy:6,rx:30,ry:12,fill:'#dfeef2'}));
    c.appendChild(el('ellipse',{cx:-28,cy:7,rx:26,ry:10,fill:'#dfeef2'}));g.appendChild(c);});}

function keep(col){return '<g transform="translate(0,-8)">'+
  '<path d="M-15,2 L-15,-14 L-9,-14 L-9,-8 L-3,-8 L-3,-14 L3,-14 L3,2 Z" fill="#8a8273" stroke="#5d5648" stroke-width="1"/>'+
  '<path d="M3,-14 L9,-14 L9,-8 L15,-8 L15,-14 L21,-14 L21,2 L3,2 Z" fill="#9a9283" stroke="#5d5648" stroke-width="1"/>'+
  '<rect x="-3" y="-6" width="6" height="8" fill="#7a7264"/>'+
  '<path d="M-1,2 L-1,-3 Q-1,-6 3,-6 Q7,-6 7,-3 L7,2 Z" fill="'+col+'"/></g>';}
function trees(){return '<g><path d="M-14,4 l5,-12 l5,12 Z" fill="#3f7a43"/><path d="M-2,2 l4,-10 l4,10 Z" fill="#4c8c50"/><path d="M9,5 l5,-13 l5,13 Z" fill="#3f7a43"/></g>';}
function tower(col){return '<g transform="translate(0,-6)"><rect x="-5" y="-14" width="10" height="16" fill="#8a8273" stroke="#5d5648" stroke-width="1"/><path d="M-6,-14 l3,-5 l3,4 l3,-4 l3,5 Z" fill="'+col+'"/></g>';}

function drawIslands(){
  const g=document.getElementById('islands');g.innerHTML='';
  tiles.forEach((t,i)=>{
    const col=FCOL[t.owner];const blob=blobs[t.sh];
    const wrap=el('g',{class:'island'});wrap.onclick=()=>select(i);

    // cast shadow on water (stays put while island bobs -> "floating")
    const sh=el('ellipse',{cx:t.x,cy:t.y+30*t.s,rx:54*t.s,ry:15*t.s,fill:'#04121d',opacity:'.42'});
    sh.setAttribute('filter','url(#glow)');wrap.appendChild(sh);
    // ripple rings on the water
    wrap.appendChild(el('ellipse',{cx:t.x,cy:t.y+30*t.s,rx:62*t.s,ry:18*t.s,fill:'none',stroke:'#bfe6ef','stroke-width':'1.5',opacity:'.14'}));
    wrap.appendChild(el('ellipse',{cx:t.x,cy:t.y+30*t.s,rx:74*t.s,ry:22*t.s,fill:'none',stroke:'#bfe6ef','stroke-width':'1','opacity':'.08'}));

    // bobbing island body
    const inner=el('g',{transform:'translate('+t.x+','+t.y+') scale('+t.s+')',class:'bob'});
    inner.style.animationDuration=(4.5+ (i%3)*0.8)+'s';inner.style.animationDelay=(-i*0.6)+'s';
    inner.style.transformOrigin=t.x+'px '+t.y+'px';
    inner.innerHTML=
      // cliff / underside (volumetric gradient), drawn deep
      '<g filter="url(#ishadow)"><path d="'+blob+'" transform="translate(0,12)" fill="url(#cliff)"/>'+
        '<path d="'+blob+'" fill="url(#cliff)"/></g>'+
      // beach foam ring
      '<path d="'+blob+'" fill="none" stroke="#ecdfb0" stroke-width="3.5" opacity=".6"/>'+
      // grass top (lit), raised to sit above cliff
      '<g transform="translate(0,-11) scale(0.9)">'+
        '<path d="'+blob+'" fill="'+(t.owner==='Unclaimed'?'#7e8a62':'#5f9e57')+'"/>'+
        '<path d="'+blob+'" fill="#ffffff" opacity=".12" transform="translate(-3,-5) scale(0.82)"/>'+
        '<path d="'+blob+'" fill="#0a2a18" opacity=".12" transform="translate(4,6) scale(0.9)"/>'+
      '</g>'+
      (selected===i?'<path d="'+blob+'" transform="translate(0,-11) scale(0.9)" fill="none" stroke="#fff" stroke-width="3.5" filter="url(#glow)" style="transform-origin:center;animation:ping 1.7s ease-out infinite"/>':'')+
      '<path d="'+blob+'" transform="translate(0,-11) scale(0.9)" fill="none" stroke="'+col+'" stroke-width="'+(selected===i?4:2.5)+'" opacity=".95"/>'+
      // structures
      '<g transform="translate(0,-11)">'+(t.gar>=120?keep(col):t.owner==='Unclaimed'?trees():tower(col))+'</g>'+
      // banner
      (t.owner!=='Unclaimed'?'<rect x="-0.8" y="-52" width="1.6" height="20" fill="#cfc7b6"/><path d="M0.8,-51 l18,5 l-18,5 Z" fill="'+col+'" stroke="rgba(0,0,0,.3)" stroke-width=".5"/>':'')+
      // garrison badge
      '<g transform="translate(0,20)"><path d="M-16,0 L16,0 L16,11 L0,17 L-16,11 Z" fill="rgba(8,16,24,.85)" stroke="'+col+'" stroke-width="1.5"/><text x="0" y="9" class="itxt" font-size="14">'+t.gar+'</text></g>'+
      '<text x="0" y="44" class="ilabel">'+(t.owner==='you'?'YOURS':t.owner==='Unclaimed'?'ISLE '+t.id:t.owner.toUpperCase())+'</text>';
    wrap.appendChild(inner);g.appendChild(wrap);
  });
}

function renderStand(){
  const counts={},str={};tiles.forEach(t=>{counts[t.owner]=(counts[t.owner]||0)+1;str[t.owner]=(str[t.owner]||0)+t.gar;});
  const order=['you','Ashen Horde','Iron Pact','Unclaimed'];const box=document.getElementById('stand');box.innerHTML='';
  order.forEach(f=>{const c=counts[f]||0,pct=Math.round(c/9*100);const d=document.createElement('div');d.className='frow';
    d.innerHTML='<span class="fdot" style="background:'+FCOL[f]+';color:'+FCOL[f]+'"></span><span class="fname '+(f==='you'?'you':'')+'">'+(f==='you'?'You':f)+'</span><span class="fbar"><span style="width:'+pct+'%;background:'+FCOL[f]+';color:'+FCOL[f]+'"></span></span><span class="fnum"><b>'+c+'</b>/9</span>';
    box.appendChild(d);});}
function fortLabel(g){return g>=120?'FORTRESS':g>=90?'FORTIFIED':'OUTPOST';}
function select(i){selected=i;drawIslands();
  const t=tiles[i];const col=FCOL[t.owner];const def=(Math.pow(t.gar,0.5)*1.3).toFixed(1);
  const garPct=Math.min(100,t.gar/180*100),defPct=Math.min(100,def/20*100);let threat,tcls;
  if(t.owner==='you'){threat='Yours. Earns +12 Flux each tick. Its garrison hardens slowly while unchallenged.';tcls='lo';}
  else if(t.gar>=120){threat='High threat. Every repelled assault has thickened these walls. Breaking it needs a heavy commitment — the defender still holds the edge.';tcls='hi';}
  else if(t.owner==='Unclaimed'){threat='Open ground. Lightly held and unclaimed — your cheapest path to expand.';tcls='mid';}
  else{threat='Moderate threat. Worth taking if you commit enough Flux to swing past the defender advantage.';tcls='mid';}
  document.getElementById('cmd').innerHTML=
    '<div class="cbanner"><div style="position:absolute;inset:0;background:'+col+';opacity:.14"></div><div class="ct">Isle '+t.id+'</div><div class="co" style="color:'+col+'">'+(t.owner==='you'?'Held by you':t.owner)+'</div><div class="ctag">'+fortLabel(t.gar)+'</div></div>'+
    '<div class="cbody"><div class="sbar"><div class="sl"><span class="l">GARRISON</span><span class="n">'+t.gar+'</span></div><div class="track"><span style="width:'+garPct+'%;background:'+col+'"></span></div></div>'+
    '<div class="sbar"><div class="sl"><span class="l">DEFENSE RATING</span><span class="n">'+def+'</span></div><div class="track"><span style="width:'+defPct+'%;background:'+col+'"></span></div></div>'+
    '<div class="meta2"><span class="l">Held since</span><span class="v">'+(t.since?'Tick '+t.since:'—')+'</span></div><div class="lastev">⚑ '+t.last+'</div><div class="threat '+tcls+'">'+threat+'</div>'+
    (t.owner!=='you'?'<div class="cta">⚔ Issue orders · @HoldfastGM</div>':'<div class="cta def">🛡 Reinforce · @HoldfastGM</div>')+'</div>';
}

const logs=[
  {tk:'T24',tx:'Dawn breaks over the isles. The <span class="h">Ashen Horde</span> stirs in the east.'},
  {tk:'T23',tx:'<span class="h">Ashen Horde</span> seized <b>Isle 07</b> and now presses your waters.'},
  {tk:'T23',tx:'<span class="p">Iron Pact</span> reinforced <b>Isle 04</b> — garrison now 110.'},
  {tk:'T22',tx:'<span class="e">You</span> held <b>Isle 02</b> against an Ashen landing (61% — won).'},
  {tk:'T21',tx:'<b>Isle 06</b> repelled its third assault. It is a fortress now.'},
  {tk:'T19',tx:'<span class="e">You</span> took <b>Isle 01</b> from <span class="p">Iron Pact</span>, +55 Flux spoils.'},
];
const tk=document.getElementById('tk');logs.concat(logs).forEach(l=>{const s=document.createElement('span');s.className='tkitem';s.innerHTML='<span class="tk">'+l.tk+'</span>'+l.tx;tk.appendChild(s);});

let secs=43084;setInterval(()=>{secs--;const h=String(Math.floor(secs/3600)).padStart(2,'0'),m=String(Math.floor(secs%3600/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s;},1000);

drawRoutes();drawClouds();drawIslands();renderStand();select(5);
</script>

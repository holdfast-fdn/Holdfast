[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10_000
# settlement code is the highest-audit-surface artifact — keep warnings loud
deny = "warnings"

[fuzz]
runs = 2048

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"

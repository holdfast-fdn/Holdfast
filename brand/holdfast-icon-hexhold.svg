<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Holdfast hex grip mark">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C232E"/>
      <stop offset="1" stop-color="#0E1219"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE7DA"/>
      <stop offset="1" stop-color="#B9C2CE"/>
    </linearGradient>
    <linearGradient id="ember2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4823C"/>
      <stop offset="1" stop-color="#D8531F"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#bg2)"/>
  <rect x="8.5" y="8.5" width="223" height="223" rx="51.5" fill="none" stroke="#3A4658" stroke-width="1"/>

  <!-- hex tile (flat-top), the territory -->
  <path d="M120 46 L184 83 L184 157 L120 194 L56 157 L56 83 Z"
        fill="none" stroke="url(#steel2)" stroke-width="13" stroke-linejoin="round"/>

  <!-- held core tile (ember) -->
  <rect x="103" y="103" width="34" height="34" rx="4" fill="url(#ember2)"/>

  <!-- clamp gripping the core: left and right brackets (holding fast) -->
  <path d="M92 92 L80 92 L80 148 L92 148" fill="none" stroke="url(#steel2)"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 92 L160 92 L160 148 L148 148" fill="none" stroke="url(#steel2)"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

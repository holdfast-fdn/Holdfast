<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- HOLDFAST — vector glyph of the Winged Anchor logo (brand/holdfast-logo.jpg).
       Simplified flat geometry for favicons, avatars, and small UI sizes where
       the pixel-art logo cannot read. Three inks: metal (gold), chain (signal),
       transparent field — place on Nyx/Basalt surfaces. -->
  <defs>
    <g id="wing">
      <polygon points="200,166 76,124  92,152 200,196"/>
      <polygon points="200,206 100,164 114,192 200,234"/>
    </g>
  </defs>

  <!-- the chain that seals the hold -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="#3FB8CE"
          stroke-width="12" stroke-dasharray="26 16" opacity="0.9"/>

  <g fill="#D9A845">
    <!-- the Herald's wings -->
    <use href="#wing"/>
    <use href="#wing" transform="translate(512 0) scale(-1 1)"/>

    <!-- the anchor that holds fast -->
    <circle cx="256" cy="84" r="30" fill="none" stroke="#D9A845" stroke-width="20"/>
    <rect x="170" y="146" width="172" height="34" rx="6"/>
    <rect x="150" y="140" width="24" height="46" rx="4"/>
    <rect x="338" y="140" width="24" height="46" rx="4"/>
    <rect x="240" y="150" width="32" height="190"/>
    <polygon points="240,340 272,340 256,392"/>
    <path d="M132 296 Q256 432 380 296 L348 272 Q256 376 164 272 Z"/>
    <polygon points="132,300 112,244 168,262"/>
    <polygon points="380,300 400,244 344,262"/>
  </g>
</svg>

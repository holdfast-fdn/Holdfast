<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Holdfast bastion mark">
  <!-- flat, premium container -->
  <rect x="8" y="8" width="224" height="224" rx="46" fill="#11161D"/>
  <rect x="8.75" y="8.75" width="222.5" height="222.5" rx="45.25" fill="none" stroke="#29323F" stroke-width="1.5"/>

  <!-- left pier: inner face straight (reads H), outer-top chamfered (bastion wall) -->
  <path d="M62 78 L82 58 L98 58 L98 184 L62 184 Z" fill="#ECE6D8"/>
  <!-- right pier: mirror -->
  <path d="M142 58 L158 58 L178 78 L178 184 L142 184 Z" fill="#ECE6D8"/>
  <!-- lintel / crossbar -->
  <rect x="98" y="104" width="44" height="34" fill="#ECE6D8"/>

  <!-- ember gate: the single accent, flat color, crisp segmental arch -->
  <path d="M107 138 L107 120 Q107 109 120 109 Q133 109 133 120 L133 138 Z" fill="#E8622C"/>
</svg>

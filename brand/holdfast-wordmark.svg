<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 200" width="1040" height="200" role="img" aria-label="Holdfast wordmark">
  <!-- HOLDFAST — wordmark. Classical display capitals, wide tracking.
       Preview uses the Cinzel font stack; production wordmark must be
       converted to outlined paths before shipping. -->
  <style>
    .wm { font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
          font-weight: 700; letter-spacing: 18px; }
  </style>
  <text x="520" y="118" text-anchor="middle" class="wm"
        font-size="92" fill="#F1EEE4">HOLDFAST</text>
  <!-- signal rule with flux spark -->
  <rect x="240" y="150" width="246" height="4" fill="#D9A845"/>
  <rect x="554" y="150" width="246" height="4" fill="#D9A845"/>
  <polygon points="520,138 534,152 520,166 506,152" fill="#3FB8CE"/>
</svg>
